<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>아이들 위치 모니터링</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📍 위치 모니터링</h1>
  <nav>
    <a href="index.html">홈</a>
    <a href="monitor.html" class="active">모니터링</a>
    <span id="logoutBtn" style="display:none;">
      <a href="#" onclick="doLogout();return false;" style="color:#e74c3c;">로그아웃</a>
    </span>
  </nav>
</header>

<div class="container" style="max-width:1000px;">
  <div class="card">
    <div class="map-wrap">
      <div id="map" class="map" style="height:500px;"></div>
      <div class="map-ctrl map-ctrl-right">
        <button class="map-btn" onclick="zoomIn()">+</button>
        <button class="map-btn" onclick="zoomOut()">−</button>
      </div>
      <div class="map-ctrl map-ctrl-bottom">
        <button class="map-btn" style="width:auto;padding:0 12px;font-size:13px;font-weight:600;" onclick="fitAll()">전체 보기</button>
      </div>
    </div>
  </div>

  <!-- 부모 모드: 자녀 관리 -->
  <div class="card" id="childMgmtCard" style="display:none;">
    <div class="flex-between">
      <h2>내 자녀 관리</h2>
      <button class="success" onclick="showAddMyChild()">+ 자녀 등록</button>
    </div>
    <div id="myChildForm" style="display:none;margin-top:10px;padding:10px;background:#f8f9fa;border-radius:6px;">
      <label>자녀 연락처</label>
      <input id="mcPhone" type="tel" inputmode="tel" placeholder="010-0000-0000">
      <label>이름</label>
      <input id="mcName" type="text" placeholder="예: 민준">
      <label>이모지</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="mcEmojiPicker"></div>
      <input id="mcEmoji" type="text" value="🐻" style="width:60px;text-align:center;font-size:20px;">
      <label>색상</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="mcColorPicker"></div>
      <input id="mcColor" type="color" value="#FF6B6B" style="width:50px;height:30px;">
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button class="success" onclick="saveMyChild()">저장</button>
        <button class="gray" onclick="hideMyChildForm()">취소</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="flex-between">
      <h2>아이들 상태</h2>
      <span class="muted" id="lastRefresh"></span>
    </div>
    <div id="parentFilterWrap"></div>
    <div id="childList"></div>
    <div id="emptyMsg" class="empty" style="display:none;">
      등록된 자녀가 없습니다.
    </div>
  </div>

  <div class="card" id="pinLegend" style="display:none;">
    <h2>거점 목록</h2>
    <div id="pinList"></div>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f3f8fa6decb5e2185b09d6bf70ef525b&autoload=false"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
var map = null;
var childMarkers = {};
var childOverlays = {};
var pinMarkers = [];
var authenticated = false;
var loginMode = null;
var currentParentId = null;
var visibleChildIds = null;

initFirebaseSync();
onDataReady(function() {
  showLoginGate();
});

function initMap() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(35.3475, 126.4180),
    level: 5
  });
  render();
  setInterval(function() { updateList(); }, 5000);
}

window.onDataChanged = function() {
  if (authenticated && map) render();
};

function render() {
  renderChildren();
  renderPins();
  updateList();
  document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString('ko-KR');
}

function renderChildren() {
  var children = getVisibleChildren();
  var locations = getLocations();

  children.forEach(function(child) {
    var loc = locations[child.id];
    if (!loc || !loc.lat) {
      if (childMarkers[child.id]) {
        childMarkers[child.id].setMap(null);
        delete childMarkers[child.id];
      }
      if (childOverlays[child.id]) {
        childOverlays[child.id].setMap(null);
        delete childOverlays[child.id];
      }
      return;
    }

    var pos = new kakao.maps.LatLng(loc.lat, loc.lng);
    var stale = isStale(loc.lastUpdate);
    var color = stale ? '#bdc3c7' : (child.color || '#3498db');

    if (childMarkers[child.id]) {
      childMarkers[child.id].setPosition(pos);
      childMarkers[child.id].setImage(emojiMarkerImage(child.emoji || '📍', color, 36));
    } else {
      var marker = new kakao.maps.Marker({
        position: pos,
        map: map,
        image: emojiMarkerImage(child.emoji || '📍', color, 36),
        zIndex: 10
      });

      var iwContent = buildInfoWindow(child, loc);
      var iw = new kakao.maps.InfoWindow({ content: iwContent, removable: true });
      kakao.maps.event.addListener(marker, 'click', (function(m, i, c) {
        return function() {
          i.setContent(buildInfoWindow(c, getLocations()[c.id]));
          toggleInfoWindow(i, m, map);
        };
      })(marker, iw, child));

      childMarkers[child.id] = marker;
    }

    if (childOverlays[child.id]) {
      childOverlays[child.id].setPosition(pos);
      childOverlays[child.id].setMap(map);
    } else {
      var nameHtml = '<div style="padding:2px 6px;background:' + color + ';color:#fff;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;transform:translateY(4px);">'
        + (child.emoji || '') + ' ' + child.name + '</div>';
      var overlay = new kakao.maps.CustomOverlay({
        position: pos,
        content: nameHtml,
        yAnchor: 0,
        map: map,
        zIndex: 5
      });
      childOverlays[child.id] = overlay;
    }
  });
}

function buildInfoWindow(child, loc) {
  if (!loc) return '<div style="padding:8px;">위치 정보 없음</div>';
  var stale = isStale(loc.lastUpdate);
  var statusColor = stale ? '#e74c3c' : '#27ae60';
  var statusText = stale ? '오프라인' : '온라인';
  if (loc.isActive === false) { statusColor = '#e74c3c'; statusText = '오프라인'; }

  var html = '<div style="padding:10px;min-width:180px;font-size:13px;line-height:1.6;">'
    + '<div style="font-weight:700;font-size:14px;margin-bottom:4px;">' + (child.emoji || '') + ' ' + child.name + '</div>'
    + '<div><span style="color:' + statusColor + ';">● ' + statusText + '</span></div>'
    + '<div>마지막: ' + timeAgo(loc.lastUpdate) + '</div>'
    + '<div>정확도: ' + (loc.accuracy || '?') + 'm</div>';
  if (loc.batteryLevel != null) {
    html += '<div>배터리: ' + loc.batteryLevel + '%</div>';
  }
  html += '<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;">'
    + '<button onclick="openKakaoNavi(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" '
    + 'style="background:#3498db;color:#fff;border:none;padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer;">🗺️ 길찾기</button>'
    + '<button onclick="ringChild(\'' + child.id + '\',\'' + child.name + '\')" '
    + 'style="background:#e74c3c;color:#fff;border:none;padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer;">🔔 벨 울리기</button>'
    + '</div></div>';
  return html;
}

function renderPins() {
  pinMarkers.forEach(function(m) { m.setMap(null); });
  pinMarkers = [];

  var pins = getPins();
  if (!pins.length) {
    document.getElementById('pinLegend').style.display = 'none';
    return;
  }
  document.getElementById('pinLegend').style.display = '';

  var listHtml = '';
  pins.forEach(function(pin) {
    var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
    var color = pin.color || cat.color;
    var emoji = pin.emoji || cat.emoji;

    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(pin.lat, pin.lng),
      map: map,
      image: pinMarkerImage(emoji, color),
      zIndex: 3
    });

    var iwContent = '<div style="padding:8px;font-size:13px;">'
      + '<b>' + emoji + ' ' + pin.name + '</b><br>'
      + '<span style="color:#888;">' + cat.label + '</span>'
      + '</div>';
    var iw = new kakao.maps.InfoWindow({ content: iwContent, removable: true });
    kakao.maps.event.addListener(marker, 'click', (function(m, i) {
      return function() { toggleInfoWindow(i, m, map); };
    })(marker, iw));

    pinMarkers.push(marker);
    listHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;">'
      + '<span style="font-size:18px;">' + emoji + '</span>'
      + '<span>' + pin.name + '</span>'
      + '<span class="muted">(' + cat.label + ')</span>'
      + '</div>';
  });
  document.getElementById('pinList').innerHTML = listHtml;
}

function updateList() {
  var children = getVisibleChildren();
  var locations = getLocations();

  if (!children.length) {
    document.getElementById('childList').innerHTML = '';
    document.getElementById('emptyMsg').style.display = '';
    return;
  }
  document.getElementById('emptyMsg').style.display = 'none';

  var html = '';
  children.forEach(function(child) {
    var loc = locations[child.id];
    var stale = !loc || isStale(loc.lastUpdate);
    var active = loc && loc.isActive !== false && !stale;
    var cls = active ? 'list-item online' : 'list-item offline';

    html += '<div class="' + cls + '" style="cursor:pointer;flex-wrap:wrap;">'
      + '<div class="emoji" onclick="focusChild(\'' + child.id + '\')">' + (child.emoji || '📍') + '</div>'
      + '<div class="info" onclick="focusChild(\'' + child.id + '\')">'
      + '<div class="name">' + child.name + '</div>'
      + '<div class="sub">';

    if (loc && loc.lat) {
      html += (active ? '<span style="color:#27ae60;">● 온라인</span>' : '<span style="color:#e74c3c;">● 오프라인</span>')
        + ' · ' + timeAgo(loc.lastUpdate);
      if (loc.batteryLevel != null) html += ' · 🔋' + loc.batteryLevel + '%';
    } else {
      html += '위치 정보 없음';
    }

    html += '</div></div>'
      + '<div style="display:flex;gap:4px;">';

    if (loc && loc.lat) {
      html += '<button onclick="event.stopPropagation();openKakaoNavi(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" '
        + 'style="background:#3498db;color:#fff;border:none;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer;" title="현재위치 길찾기">🗺️</button>';
    }

    html += '<button onclick="event.stopPropagation();ringChild(\'' + child.id + '\',\'' + child.name + '\')" '
      + 'style="background:#e74c3c;color:#fff;border:none;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer;" title="벨 울리기">🔔</button>';

    if (loginMode === 'parent') {
      html += '<button onclick="event.stopPropagation();removeMyChild(\'' + child.id + '\',\'' + child.name + '\')" '
        + 'style="background:#95a5a6;color:#fff;border:none;padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer;" title="자녀 해제">✕</button>';
    }

    html += '</div></div>';
  });
  document.getElementById('childList').innerHTML = html;
}

function ringChild(childId, childName) {
  if (!confirm(childName + ' 폰에서 벨을 울릴까요?')) return;
  fbDb.ref('/alerts/' + childId).set({
    ring: true,
    timestamp: Date.now()
  });
  alert(childName + ' 폰에 벨 신호를 보냈습니다.\n아이 폰에서 페이지가 열려있어야 울립니다.');
  setTimeout(function() {
    fbDb.ref('/alerts/' + childId).remove();
  }, 30000);
}

function focusChild(id) {
  var loc = getLocations()[id];
  if (!loc || !loc.lat) return;
  map.setCenter(new kakao.maps.LatLng(loc.lat, loc.lng));
  map.setLevel(3);
  if (childMarkers[id]) {
    var children = getChildren();
    var child = children.find(function(c) { return c.id === id; });
    if (child) {
      var iwContent = buildInfoWindow(child, loc);
      var iw = new kakao.maps.InfoWindow({ content: iwContent, removable: true });
      toggleInfoWindow(iw, childMarkers[id], map);
    }
  }
}

function fitAll() {
  if (!map) return;
  var bounds = new kakao.maps.LatLngBounds();
  var hasPoints = false;

  var locations = getLocations();
  getVisibleChildren().forEach(function(c) {
    var loc = locations[c.id];
    if (loc && loc.lat) {
      bounds.extend(new kakao.maps.LatLng(loc.lat, loc.lng));
      hasPoints = true;
    }
  });
  getPins().forEach(function(p) {
    if (p.lat) {
      bounds.extend(new kakao.maps.LatLng(p.lat, p.lng));
      hasPoints = true;
    }
  });

  if (hasPoints) map.setBounds(bounds);
}

function zoomIn() { if (map) map.setLevel(Math.max(1, map.getLevel() - 1)); }
function zoomOut() { if (map) map.setLevel(Math.min(14, map.getLevel() + 1)); }

// ──── 로그인 게이트 ────
function showLoginGate() {
  var parents = getParents();

  var html = '<div class="pin-gate" id="loginGate">'
    + '<div class="pin-box" style="max-width:320px;">'
    + '<div style="font-size:42px;margin-bottom:8px;">👋</div>'
    + '<h2 style="color:#2c3e50;margin-bottom:16px;">로그인</h2>'
    + '<div id="loginFormArea">'
    + '<label style="text-align:left;">아이디</label>'
    + '<input id="loginId" type="text" placeholder="아이디 입력" style="margin-bottom:8px;">'
    + '<label style="text-align:left;">비밀번호</label>'
    + '<input id="loginPw" type="password" placeholder="비밀번호 입력" '
    + 'onkeydown="if(event.key===\'Enter\')doLogin()">'
    + '<div id="loginErr" style="color:#e74c3c;font-size:12px;margin-top:6px;min-height:16px;"></div>'
    + '<button onclick="doLogin()" style="width:100%;margin-top:8px;padding:12px;font-size:15px;font-weight:600;">로그인</button>'
    + '</div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  setTimeout(function() { document.getElementById('loginId').focus(); }, 100);
}

function doLogin() {
  var id = document.getElementById('loginId').value.trim();
  var pw = document.getElementById('loginPw').value;
  if (!id || !pw) {
    document.getElementById('loginErr').textContent = '아이디와 비밀번호를 입력하세요.';
    return;
  }

  // 관리자 체크
  var cfg = getConfig();
  if (cfg.adminId && id === cfg.adminId && pw === cfg.adminPw) {
    document.getElementById('loginGate').remove();
    loginMode = 'admin';
    visibleChildIds = null;
    authenticated = true;
    document.getElementById('logoutBtn').style.display = '';
    addParentFilter();
    kakao.maps.load(initMap);
    return;
  }

  // 부모 체크
  var parents = getParents();
  var parent = parents.find(function(p) { return p.loginId === id; });
  if (parent && parent.loginPw === pw) {
    document.getElementById('loginGate').remove();
    loginMode = 'parent';
    currentParentId = parent.id;
    visibleChildIds = parent.childIds || [];
    authenticated = true;
    document.getElementById('logoutBtn').style.display = '';
    document.getElementById('childMgmtCard').style.display = '';
    kakao.maps.load(initMap);
    return;
  }

  document.getElementById('loginErr').textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
  document.getElementById('loginPw').value = '';
}

function doLogout() {
  location.reload();
}

function addParentFilter() {
  var parents = getParents();
  if (!parents.length) return;

  var filterHtml = '<div style="margin-bottom:8px;">'
    + '<select id="parentFilter" onchange="applyParentFilter()" style="width:100%;">'
    + '<option value="all">👁 전체 보기</option>';
  parents.forEach(function(p) {
    filterHtml += '<option value="' + p.id + '">👤 ' + p.name + '</option>';
  });
  filterHtml += '</select></div>';
  document.getElementById('parentFilterWrap').innerHTML = filterHtml;
}

function applyParentFilter() {
  var val = document.getElementById('parentFilter').value;
  if (val === 'all') {
    visibleChildIds = null;
  } else {
    var parent = getParents().find(function(p) { return p.id === val; });
    visibleChildIds = parent ? (parent.childIds || []) : [];
  }
  render();
}

function getVisibleChildren() {
  var children = getChildren();
  if (!visibleChildIds) return children;
  return children.filter(function(c) { return visibleChildIds.indexOf(c.id) !== -1; });
}

// ──── 부모 모드: 자녀 등록/해제 ────
function showAddMyChild() {
  var children = getChildren();
  var idx = children.length;
  document.getElementById('mcEmoji').value = CHILD_EMOJIS[idx % CHILD_EMOJIS.length];
  document.getElementById('mcColor').value = CHILD_COLORS[idx % CHILD_COLORS.length];
  document.getElementById('mcPhone').value = '';
  document.getElementById('mcName').value = '';
  buildMyChildPickers(idx);
  document.getElementById('myChildForm').style.display = '';
}

function buildMyChildPickers(idx) {
  var emojiHtml = '';
  CHILD_EMOJIS.forEach(function(e) {
    emojiHtml += '<button type="button" onclick="document.getElementById(\'mcEmoji\').value=\'' + e + '\'" '
      + 'style="font-size:20px;background:none;border:1px solid #ddd;border-radius:6px;padding:4px 8px;cursor:pointer;">'
      + e + '</button>';
  });
  document.getElementById('mcEmojiPicker').innerHTML = emojiHtml;

  var colorHtml = '';
  CHILD_COLORS.forEach(function(c) {
    colorHtml += '<button type="button" onclick="document.getElementById(\'mcColor\').value=\'' + c + '\'" '
      + 'style="width:28px;height:28px;border-radius:50%;background:' + c + ';border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0;">'
      + '</button>';
  });
  document.getElementById('mcColorPicker').innerHTML = colorHtml;
}

function hideMyChildForm() {
  document.getElementById('myChildForm').style.display = 'none';
}

function saveMyChild() {
  var phone = document.getElementById('mcPhone').value.trim();
  var name = document.getElementById('mcName').value.trim();
  if (!phone) { alert('연락처를 입력하세요.'); return; }
  if (!name) { alert('이름을 입력하세요.'); return; }

  var normPhone = phone.replace(/[^0-9]/g, '');
  var existing = getChildren().find(function(c) { return (c.phone || '').replace(/[^0-9]/g, '') === normPhone; });

  var childId;
  if (existing) {
    childId = existing.id;
  } else {
    childId = uid();
    var children = getChildren();
    var data = {
      name: name,
      emoji: document.getElementById('mcEmoji').value || '🐻',
      color: document.getElementById('mcColor').value || '#FF6B6B',
      phone: phone,
      order: children.length + 1
    };
    fbDb.ref('/children/' + childId).set(data);
  }

  var parent = getParents().find(function(p) { return p.id === currentParentId; });
  if (parent) {
    var ids = parent.childIds || [];
    if (ids.indexOf(childId) === -1) {
      ids.push(childId);
      fbDb.ref('/parents/' + currentParentId + '/childIds').set(ids);
      visibleChildIds = ids;
    }
  }

  hideMyChildForm();
  setTimeout(function() { render(); }, 500);
}

function removeMyChild(childId, childName) {
  if (!confirm(childName + '을(를) 내 자녀 목록에서 해제할까요?\n(아이 데이터는 삭제되지 않습니다)')) return;
  var parent = getParents().find(function(p) { return p.id === currentParentId; });
  if (parent) {
    var ids = (parent.childIds || []).filter(function(id) { return id !== childId; });
    fbDb.ref('/parents/' + currentParentId + '/childIds').set(ids);
    visibleChildIds = ids;
    setTimeout(function() { render(); }, 500);
  }
}
</script>
</body>
</html>
