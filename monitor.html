<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>아이들 위치 모니터링</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .map-type-bar {
      position:absolute;top:10px;left:10px;z-index:5;
      display:flex;gap:0;background:rgba(255,255,255,0.95);border-radius:6px;
      box-shadow:0 1px 4px rgba(0,0,0,0.15);overflow:hidden;
    }
    .map-type-btn {
      padding:6px 10px;border:none;background:none;font-size:11px;
      font-weight:600;color:#555;cursor:pointer;border-right:1px solid #e0e0e0;
    }
    .map-type-btn:last-child { border-right:none; }
    .map-type-btn.active { background:#3498db;color:#fff; }
    .child-actions { display:flex;gap:3px;flex-shrink:0; }
    .child-actions button {
      border:none;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer;
    }
    .pin-modal {
      position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;
      display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .pin-modal-box {
      background:#fff;border-radius:12px;padding:20px;max-width:320px;width:100%;text-align:center;
    }
    .share-loc-btn {
      display:block;width:100%;padding:12px;margin-top:0;
      border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
    }
    .share-loc-btn.active { background:#e74c3c;color:#fff; }
    .share-loc-btn.inactive { background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff; }
    .sos-alert {
      background:#e74c3c;color:#fff;padding:12px;border-radius:8px;
      text-align:center;margin-bottom:8px;animation:pulse-ring 0.5s infinite alternate;
    }
    .child-pin-badge {
      display:inline-block;background:#f39c12;color:#fff;padding:2px 6px;
      border-radius:10px;font-size:10px;font-weight:600;margin-left:4px;
    }
  </style>
</head>
<body>
<header>
  <h1>📍 위치 모니터링</h1>
  <nav>
    <a href="index.html">홈</a>
    <span id="logoutBtn" style="display:none;">
      <a href="#" onclick="doLogout();return false;" style="color:#e74c3c;font-size:12px;">로그아웃</a>
    </span>
  </nav>
</header>

<div class="container" style="max-width:1000px;">
  <!-- SOS 알림 영역 -->
  <div id="sosAlerts"></div>

  <div class="card">
    <div class="map-wrap">
      <div id="map" class="map" style="height:500px;"></div>
      <div class="map-type-bar" id="mapTypeBar">
        <button class="map-type-btn active" onclick="setMapType('normal')">지도</button>
        <button class="map-type-btn" onclick="setMapType('skyview')">위성</button>
        <button class="map-type-btn" onclick="setMapType('hybrid')">혼합</button>
      </div>
      <div class="map-ctrl map-ctrl-right">
        <button class="map-btn" onclick="zoomIn()">+</button>
        <button class="map-btn" onclick="zoomOut()">−</button>
      </div>
      <div class="map-ctrl map-ctrl-bottom">
        <button class="map-btn" style="width:auto;padding:0 12px;font-size:13px;font-weight:600;" onclick="fitAll()">전체 보기</button>
      </div>
    </div>
  </div>

  <!-- 부모 위치 공유 -->
  <div class="card" id="parentShareCard" style="display:none;">
    <div class="flex-between" style="margin-bottom:8px;">
      <h2>📡 내 위치 공유</h2>
    </div>
    <button class="share-loc-btn inactive" id="shareLocBtn" onclick="toggleParentShare()">📍 내 위치 공유 시작</button>
    <div id="parentShareStatus" style="display:none;margin-top:8px;text-align:center;">
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <span class="pulse"></span>
        <span style="font-size:13px;color:#27ae60;">위치 공유 중</span>
      </div>
    </div>
  </div>

  <!-- 부모: 자녀 관리 -->
  <div class="card" id="childMgmtCard" style="display:none;">
    <div class="flex-between">
      <h2>내 자녀 관리</h2>
      <button class="success small" onclick="showAddMyChild()">+ 자녀 등록</button>
    </div>
    <div id="myChildList"></div>
    <div id="myChildForm" style="display:none;margin-top:8px;padding:10px;background:#f8f9fa;border-radius:6px;">
      <label>이름</label>
      <input id="mcName" type="text" placeholder="이름">
      <label>연락처</label>
      <input id="mcPhone" type="tel" inputmode="tel" placeholder="010-0000-0000 (선택)">
      <label>이모지</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="mcEmojiPicker"></div>
      <input id="mcEmoji" type="text" value="🐻" style="width:50px;text-align:center;font-size:18px;">
      <label>색상</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="mcColorPicker"></div>
      <input id="mcColor" type="color" value="#FF6B6B" style="width:50px;height:30px;">
      <div style="margin-top:8px;display:flex;gap:4px;">
        <button class="success small" onclick="saveMyChild()">저장</button>
        <button class="gray small" onclick="hideMyChildForm()">취소</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="flex-between">
      <h2>아이들 상태</h2>
      <span class="muted" id="lastRefresh"></span>
    </div>
    <div id="parentFilterWrap"></div>
    <div id="childList"></div>
    <div id="emptyMsg" class="empty" style="display:none;">등록된 자녀가 없습니다.</div>
  </div>

  <!-- 아이 핑 목록 -->
  <div class="card" id="childPinsCard" style="display:none;">
    <h2>📍 아이들 핑</h2>
    <div id="childPinsList"></div>
  </div>

  <div class="card" id="pinLegend" style="display:none;">
    <div class="flex-between">
      <h2>📌 거점 목록</h2>
      <button class="success small" onclick="showAddPin()">+ 거점 추가</button>
    </div>
    <div id="pinList"></div>
  </div>

  <!-- 거점 추가/수정 폼 -->
  <div class="card" id="pinFormCard" style="display:none;">
    <h2 id="pinFormTitle">거점 추가</h2>
    <input type="hidden" id="editPinId">
    <label>이름</label>
    <input id="pfName" type="text" placeholder="우리집, 학원">
    <label>카테고리</label>
    <select id="pfCategory" onchange="onPinCategoryChange()">
      <option value="home">🏠 집</option>
      <option value="school">🏫 학교</option>
      <option value="academy">📚 학원</option>
      <option value="work">🏢 회사</option>
      <option value="other">📍 기타</option>
    </select>
    <div style="display:flex;gap:6px;">
      <div><label>이모지</label><input id="pfEmoji" type="text" value="🏠" style="width:50px;text-align:center;font-size:18px;"></div>
      <div><label>색상</label><input id="pfColor" type="color" value="#e74c3c" style="width:50px;height:30px;"></div>
    </div>
    <label>주소 검색</label>
    <div style="display:flex;gap:4px;">
      <input id="pfAddress" type="text" placeholder="주소 입력" style="flex:1;">
      <button class="small" onclick="searchPinAddress()">검색</button>
    </div>
    <div id="addressResults" style="margin-top:4px;max-height:120px;overflow-y:auto;"></div>
    <label>좌표</label>
    <div style="display:flex;gap:4px;">
      <input id="pfLat" type="number" step="any" placeholder="위도">
      <input id="pfLng" type="number" step="any" placeholder="경도">
    </div>
    <p class="muted" style="margin-top:4px;">또는 위 지도에서 길게 누르면 좌표가 입력됩니다</p>
    <div style="margin-top:8px;display:flex;gap:4px;">
      <button class="success small" onclick="savePin()">저장</button>
      <button class="gray small" onclick="hidePinForm()">취소</button>
    </div>
  </div>

  <!-- 내 설정 -->
  <div class="card" id="mySettingsCard" style="display:none;">
    <h2>⚙️ 내 설정</h2>
    <div style="margin-top:8px;">
      <button onclick="saveDefaultMapPos()" style="width:100%;padding:10px;background:#3498db;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">📍 현재 지도 위치를 기본으로 저장</button>
      <p class="muted" style="margin-top:4px;text-align:center;">다음 로그인 시 이 위치에서 지도가 시작됩니다</p>
    </div>
    <div id="savedPosInfo" class="muted" style="margin-top:6px;text-align:center;"></div>
  </div>
</div>

<!-- 거점 상세 모달 -->
<div class="pin-modal" id="pinModal" style="display:none;" onclick="if(event.target===this)closePinModal()">
  <div class="pin-modal-box">
    <div style="font-size:36px;" id="pmEmoji"></div>
    <h3 id="pmName" style="margin:8px 0 4px;"></h3>
    <div id="pmCategory" class="muted" style="margin-bottom:12px;"></div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
      <button onclick="naviToPinWalk()" style="background:#27ae60;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;">🚶 도보 네비</button>
      <button onclick="naviToPinCar()" style="background:#3498db;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;">🚗 차량 네비</button>
    </div>
    <button onclick="closePinModal()" style="margin-top:12px;background:#95a5a6;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;">닫기</button>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f3f8fa6decb5e2185b09d6bf70ef525b&libraries=services&autoload=false"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
var map = null;
var childMarkers = {};
var childOverlays = {};
var pinMarkers = [];
var childPinMarkers = [];
var parentLocMarkers = {};
var authenticated = false;
var loginMode = null;
var currentParentId = null;
var visibleChildIds = null;
var selectedPinData = null;
var distanceLogs = {};
var prevLocations = {};
var parentShareActive = false;
var parentWatchId = null;
var geocoder = null;
var longPressTimer = null;

initFirebaseSync();
onDataReady(function() { showLoginGate(); });

function initMap() {
  var defLat = 35.3475, defLng = 126.4180, defLevel = 5;
  var shareId = currentParentId || 'admin';
  var saved = getParentSettings(shareId);
  if (loginMode === 'admin') {
    var cfg = getConfig();
    if (cfg.mapLat) { defLat = cfg.mapLat; defLng = cfg.mapLng; defLevel = cfg.mapLevel || 5; saved = cfg; }
  }
  if (saved && saved.mapLat) { defLat = saved.mapLat; defLng = saved.mapLng; defLevel = saved.mapLevel || 5; }

  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(defLat, defLng), level: defLevel
  });

  kakao.maps.event.addListener(map, 'rightclick', function(e) {
    var lat = e.latLng.getLat();
    var lng = e.latLng.getLng();
    document.getElementById('pfLat').value = lat.toFixed(6);
    document.getElementById('pfLng').value = lng.toFixed(6);
    if (document.getElementById('pinFormCard').style.display === 'none') {
      showAddPin();
    }
  });

  if (!geocoder) geocoder = new kakao.maps.services.Geocoder();
  showSavedPosInfo(saved);
  render();
  setInterval(function() { updateList(); trackDistances(); }, 5000);
}

window.onDataChanged = function() {
  if (authenticated && map) render();
  checkSOS();
};

function render() {
  renderChildren();
  renderPins();
  renderChildPins();
  renderParentLocations();
  updateList();
  document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString('ko-KR');
}

// ──── 지도 타입 ────
function setMapType(type) {
  if (!map) return;
  document.querySelectorAll('.map-type-btn').forEach(function(b) { b.classList.remove('active'); });
  if (type === 'normal') {
    map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
    document.querySelectorAll('.map-type-btn')[0].classList.add('active');
  } else if (type === 'skyview') {
    map.setMapTypeId(kakao.maps.MapTypeId.SKYVIEW);
    document.querySelectorAll('.map-type-btn')[1].classList.add('active');
  } else {
    map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
    document.querySelectorAll('.map-type-btn')[2].classList.add('active');
  }
}

// ──── 이동 거리 추적 ────
function trackDistances() {
  var locations = getLocations();
  getVisibleChildren().forEach(function(child) {
    var loc = locations[child.id];
    if (!loc || !loc.lat || !loc.isActive) return;
    var prev = prevLocations[child.id];
    if (prev && prev.lat && prev.lng) {
      var d = distance(prev.lat, prev.lng, loc.lat, loc.lng);
      if (d > 3 && d < 10000) {
        distanceLogs[child.id] = (distanceLogs[child.id] || 0) + d;
      }
    }
    prevLocations[child.id] = { lat: loc.lat, lng: loc.lng };
  });
}

function getDistanceText(childId) {
  var m = distanceLogs[childId] || 0;
  if (m < 10) return '';
  if (m < 1000) return Math.round(m) + 'm';
  return (m / 1000).toFixed(1) + 'km';
}

// ──── 아이 마커 ────
function renderChildren() {
  var children = getVisibleChildren();
  var locations = getLocations();

  children.forEach(function(child) {
    var loc = locations[child.id];
    if (!loc || !loc.lat) {
      if (childMarkers[child.id]) { childMarkers[child.id].setMap(null); delete childMarkers[child.id]; }
      if (childOverlays[child.id]) { childOverlays[child.id].setMap(null); delete childOverlays[child.id]; }
      return;
    }
    var pos = new kakao.maps.LatLng(loc.lat, loc.lng);
    var stale = isStale(loc.lastUpdate);
    var color = stale ? '#bdc3c7' : (child.color || '#3498db');

    if (childMarkers[child.id]) {
      childMarkers[child.id].setPosition(pos);
      childMarkers[child.id].setImage(emojiMarkerImage(child.emoji || '📍', color, 36));
    } else {
      var marker = new kakao.maps.Marker({
        position: pos, map: map,
        image: emojiMarkerImage(child.emoji || '📍', color, 36), zIndex: 10
      });
      var iw = new kakao.maps.InfoWindow({ content: buildInfoWindow(child, loc), removable: true });
      kakao.maps.event.addListener(marker, 'click', (function(m, i, c) {
        return function() {
          i.setContent(buildInfoWindow(c, getLocations()[c.id]));
          toggleInfoWindow(i, m, map);
        };
      })(marker, iw, child));
      childMarkers[child.id] = marker;
    }

    if (childOverlays[child.id]) {
      childOverlays[child.id].setPosition(pos);
    } else {
      var nameHtml = '<div style="padding:2px 6px;background:' + color + ';color:#fff;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;transform:translateY(4px);">'
        + (child.emoji || '') + ' ' + child.name + '</div>';
      childOverlays[child.id] = new kakao.maps.CustomOverlay({
        position: pos, content: nameHtml, yAnchor: 0, map: map, zIndex: 5
      });
    }
  });
}

function buildInfoWindow(child, loc) {
  if (!loc) return '<div style="padding:8px;">위치 정보 없음</div>';
  var stale = isStale(loc.lastUpdate);
  var sc = stale ? '#e74c3c' : '#27ae60';
  var st = stale ? '오프라인' : '온라인';
  if (loc.isActive === false) { sc = '#e74c3c'; st = '오프라인'; }
  var dist = getDistanceText(child.id);

  var html = '<div style="padding:10px;min-width:180px;font-size:13px;line-height:1.6;">'
    + '<div style="font-weight:700;font-size:14px;margin-bottom:4px;">' + (child.emoji||'') + ' ' + child.name + '</div>'
    + '<div><span style="color:' + sc + ';">● ' + st + '</span></div>'
    + '<div>마지막: ' + timeAgo(loc.lastUpdate) + '</div>';
  if (loc.accuracy) html += '<div>정확도: ' + loc.accuracy + 'm</div>';
  if (loc.batteryLevel != null) html += '<div>🔋 ' + loc.batteryLevel + '%</div>';
  if (dist) html += '<div>📏 이동거리: ' + dist + '</div>';
  if (child.phone) html += '<div><a href="tel:' + child.phone + '" style="color:#3498db;">📞 ' + child.phone + '</a></div>';
  html += '<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;">'
    + '<button onclick="openNaviWalk(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#27ae60;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer;">🚶 도보</button>'
    + '<button onclick="openNaviCar(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#3498db;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer;">🚗 차량</button>'
    + '<button onclick="ringChild(\'' + child.id + '\',\'' + child.name + '\')" style="background:#e74c3c;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer;">🔔 벨</button>'
    + '</div></div>';
  return html;
}

// ──── 네비 (도보/차량) ────
function openNaviWalk(name, lat, lng) {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|Android/.test(ua)) {
    location.href = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=FOOT';
  } else {
    window.open('https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng);
  }
}
function openNaviCar(name, lat, lng) {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|Android/.test(ua)) {
    location.href = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=CAR';
  } else {
    window.open('https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng);
  }
}

// ──── 거점 ────
function renderPins() {
  pinMarkers.forEach(function(m) { m.setMap(null); });
  pinMarkers = [];
  var pins = getPins();
  if (!pins.length) { document.getElementById('pinLegend').style.display = 'none'; return; }
  document.getElementById('pinLegend').style.display = '';

  var listHtml = '';
  pins.forEach(function(pin) {
    var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
    var color = pin.color || cat.color;
    var emoji = pin.emoji || cat.emoji;

    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(pin.lat, pin.lng),
      map: map, image: pinMarkerImage(emoji, color), zIndex: 3
    });
    kakao.maps.event.addListener(marker, 'click', (function(p, c) {
      return function() { showPinModal(p, c); };
    })(pin, cat));

    pinMarkers.push(marker);
    listHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;cursor:pointer;" onclick="showPinModal2(\'' + pin.id + '\')">'
      + '<span style="font-size:18px;">' + emoji + '</span>'
      + '<span style="flex:1;">' + pin.name + '</span>'
      + '<span class="muted">(' + cat.label + ')</span>'
      + '</div>';
  });
  document.getElementById('pinList').innerHTML = listHtml;
}

function showPinModal(pin, cat) {
  selectedPinData = pin;
  document.getElementById('pmEmoji').textContent = pin.emoji || cat.emoji;
  document.getElementById('pmName').textContent = pin.name;
  document.getElementById('pmCategory').textContent = cat.label;
  document.getElementById('pinModal').style.display = '';
}
function showPinModal2(pinId) {
  var pin = getPins().find(function(p) { return p.id === pinId; });
  if (!pin) return;
  var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
  showPinModal(pin, cat);
}
function closePinModal() { document.getElementById('pinModal').style.display = 'none'; selectedPinData = null; }
function naviToPinWalk() {
  if (!selectedPinData) return;
  closePinModal();
  openNaviWalk(selectedPinData.name, selectedPinData.lat, selectedPinData.lng);
}
function naviToPinCar() {
  if (!selectedPinData) return;
  closePinModal();
  openNaviCar(selectedPinData.name, selectedPinData.lat, selectedPinData.lng);
}

// ──── 아이 핑 (childPins) ────
function renderChildPins() {
  childPinMarkers.forEach(function(m) { m.setMap(null); });
  childPinMarkers = [];
  var cPins = getChildPins();
  var visibleIds = visibleChildIds;
  if (visibleIds) {
    cPins = cPins.filter(function(cp) { return visibleIds.indexOf(cp.childId) !== -1; });
  }

  if (!cPins.length) {
    document.getElementById('childPinsCard').style.display = 'none';
    return;
  }
  document.getElementById('childPinsCard').style.display = '';

  var children = getChildren();
  var listHtml = '';

  cPins.forEach(function(cp) {
    var c = children.find(function(x) { return x.id === cp.childId; });
    var emoji = c ? (c.emoji || '📍') : '📍';
    var name = c ? c.name : '?';

    var marker = new kakao.maps.Marker({

// ──── 부모 위치 공유 ────
function toggleParentShare() {
  if (parentShareActive) {
    stopParentShare();
  } else {
    startParentShare();
  }
}

function startParentShare() {
  if (!navigator.geolocation) { alert('GPS를 지원하지 않는 브라우저입니다.'); return; }
  if (!currentParentId && loginMode !== 'admin') return;
  var shareId = currentParentId || 'admin';

  parentShareActive = true;
  document.getElementById('shareLocBtn').textContent = '⏹ 위치 공유 중지';
  document.getElementById('shareLocBtn').className = 'share-loc-btn active';
  document.getElementById('parentShareStatus').style.display = '';

  parentWatchId = navigator.geolocation.watchPosition(
    function(pos) {
      var payload = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: Math.round(pos.coords.accuracy),
        timestamp: Date.now(),
        isActive: true
      };
      fbDb.ref('/parentLocations/' + shareId).set(payload);
    },
    function(err) {
      console.log('Parent GPS error:', err.message);
    },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
  );

  requestWakeLock();

  fbDb.ref('/parentLocations/' + shareId).onDisconnect().update({
    isActive: false, timestamp: firebase.database.ServerValue.TIMESTAMP
  });
}

function stopParentShare() {
  parentShareActive = false;
  if (parentWatchId !== null) {
    navigator.geolocation.clearWatch(parentWatchId);
    parentWatchId = null;
  }
  var shareId = currentParentId || 'admin';
  fbDb.ref('/parentLocations/' + shareId).update({ isActive: false, timestamp: Date.now() });
  releaseWakeLock();

  document.getElementById('shareLocBtn').textContent = '📍 내 위치 공유 시작';
  document.getElementById('shareLocBtn').className = 'share-loc-btn inactive';
  document.getElementById('parentShareStatus').style.display = 'none';
}

function renderParentLocations() {
  var plocs = getParentLocations();
  var parents = getParents();

  Object.keys(parentLocMarkers).forEach(function(k) {
    parentLocMarkers[k].setMap(null);
    delete parentLocMarkers[k];
  });

  Object.keys(plocs).forEach(function(pid) {
    var pl = plocs[pid];
    if (!pl || !pl.lat || !pl.isActive) return;
    if (isStale(pl.timestamp)) return;

    var parent = parents.find(function(p) { return p.id === pid; });
    var name = parent ? parent.name : (pid === 'admin' ? '관리자' : '부모');

    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(pl.lat, pl.lng),
      map: map,
      image: emojiMarkerImage('👤', '#8e44ad', 32),
      zIndex: 8
    });
    var phone = parent ? (parent.phone || '') : '';
    var iwHtml = '<div style="padding:8px;font-size:12px;min-width:100px;">'
      + '<b>👤 ' + name + '</b>'
      + '<div class="muted">' + timeAgo(pl.timestamp) + '</div>';
    if (phone) iwHtml += '<div><a href="tel:' + phone + '" style="color:#3498db;">📞 ' + phone + '</a></div>';
    iwHtml += '</div>';
    var iw = new kakao.maps.InfoWindow({ content: iwHtml, removable: true });
    kakao.maps.event.addListener(marker, 'click', (function(m, i) {
      return function() { toggleInfoWindow(i, m, map); };
    })(marker, iw));

    var nameOvl = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(pl.lat, pl.lng),
      content: '<div style="padding:1px 5px;background:#8e44ad;color:#fff;border-radius:8px;font-size:10px;font-weight:600;white-space:nowrap;transform:translateY(4px);">👤 ' + name + '</div>',
      yAnchor: 0, map: map, zIndex: 7
    });

    parentLocMarkers[pid] = marker;
    parentLocMarkers[pid + '_ovl'] = nameOvl;
  });
}

// ──── 아이 리스트 ────
function updateList() {
  var children = getVisibleChildren();
  var locations = getLocations();
  var cPins = getChildPins();
  if (!children.length) {
    document.getElementById('childList').innerHTML = '';
    document.getElementById('emptyMsg').style.display = '';
    return;
  }
  document.getElementById('emptyMsg').style.display = 'none';

  var html = '';
  children.forEach(function(child) {
    var loc = locations[child.id];
    var stale = !loc || isStale(loc.lastUpdate);
    var active = loc && loc.isActive !== false && !stale;
    var cls = active ? 'list-item online' : 'list-item offline';
    var dist = getDistanceText(child.id);
    var pinCount = cPins.filter(function(cp) { return cp.childId === child.id; }).length;

    html += '<div class="' + cls + '" style="flex-wrap:wrap;">'
      + '<div class="emoji" onclick="focusChild(\'' + child.id + '\')" style="cursor:pointer;">' + (child.emoji || '📍') + '</div>'
      + '<div class="info" onclick="focusChild(\'' + child.id + '\')" style="cursor:pointer;">'
      + '<div class="name">' + child.name;
    if (pinCount > 0) {
      html += '<span class="child-pin-badge">핑 ' + pinCount + '</span>';
    }
    if (child.phone) {
      html += ' <a href="tel:' + child.phone + '" onclick="event.stopPropagation()" style="font-size:12px;color:#3498db;text-decoration:none;">📞</a>';
    }
    html += '</div><div class="sub">';

    if (loc && loc.lat) {
      html += (active ? '<span style="color:#27ae60;">●</span>' : '<span style="color:#e74c3c;">●</span>')
        + ' ' + timeAgo(loc.lastUpdate);
      if (loc.batteryLevel != null) html += ' · 🔋' + loc.batteryLevel + '%';
      if (dist) html += ' · 📏' + dist;
    } else {
      html += '위치 정보 없음';
    }

    html += '</div></div><div class="child-actions">';

    if (loc && loc.lat) {
      html += '<button onclick="event.stopPropagation();openNaviWalk(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#27ae60;color:#fff;" title="도보 네비">🚶</button>'
        + '<button onclick="event.stopPropagation();openNaviCar(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#3498db;color:#fff;" title="차량 네비">🚗</button>';
    }
    html += '<button onclick="event.stopPropagation();ringChild(\'' + child.id + '\',\'' + child.name + '\')" style="background:#e74c3c;color:#fff;" title="벨 울리기">🔔</button>';

    if (loginMode === 'parent') {
      html += '<button onclick="event.stopPropagation();removeMyChild(\'' + child.id + '\',\'' + child.name + '\')" style="background:#95a5a6;color:#fff;font-size:11px;" title="해제">✕</button>';
    }
    html += '</div></div>';
  });
  document.getElementById('childList').innerHTML = html;
}

function ringChild(childId, childName) {
  if (!confirm(childName + ' 폰에서 벨을 울릴까요?')) return;
  fbDb.ref('/alerts/' + childId).set({ ring: true, timestamp: Date.now() });
  alert(childName + ' 폰에 벨 신호를 보냈습니다.');
  setTimeout(function() { fbDb.ref('/alerts/' + childId).remove(); }, 30000);
}

function focusChild(id) {
  var loc = getLocations()[id];
  if (!loc || !loc.lat) return;
  map.setCenter(new kakao.maps.LatLng(loc.lat, loc.lng));
  map.setLevel(3);
}

function fitAll() {
  if (!map) return;
  var bounds = new kakao.maps.LatLngBounds();
  var has = false;
  var locs = getLocations();
  getVisibleChildren().forEach(function(c) {
    var l = locs[c.id];
    if (l && l.lat) { bounds.extend(new kakao.maps.LatLng(l.lat, l.lng)); has = true; }
  });
  getPins().forEach(function(p) {
    if (p.lat) { bounds.extend(new kakao.maps.LatLng(p.lat, p.lng)); has = true; }
  });
  var plocs = getParentLocations();
  Object.keys(plocs).forEach(function(k) {
    var pl = plocs[k];
    if (pl && pl.lat && pl.isActive) { bounds.extend(new kakao.maps.LatLng(pl.lat, pl.lng)); has = true; }
  });
  if (has) map.setBounds(bounds);
}

function zoomIn() { if (map) map.setLevel(Math.max(1, map.getLevel() - 1)); }
function zoomOut() { if (map) map.setLevel(Math.min(14, map.getLevel() + 1)); }

function showLoginGate() {
  var html = '<div class="pin-gate" id="loginGate">'
    + '<div class="pin-box" style="max-width:300px;">'
    + '<div style="font-size:36px;margin-bottom:6px;">👋</div>'
    + '<h2 style="color:#2c3e50;margin-bottom:12px;font-size:16px;">로그인</h2>'
    + '<input id="loginId" type="text" placeholder="아이디" style="margin-bottom:6px;font-size:13px;">'
    + '<input id="loginPw" type="password" placeholder="비밀번호" style="font-size:13px;" onkeydown="if(event.key===\'Enter\')doLogin()">'
    + '<div id="loginErr" style="color:#e74c3c;font-size:11px;margin-top:4px;min-height:14px;"></div>'
    + '<button onclick="doLogin()" style="width:100%;margin-top:6px;padding:10px;font-size:14px;font-weight:600;">로그인</button>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  setTimeout(function() { document.getElementById('loginId').focus(); }, 100);
}

function doLogin() {
  var id = document.getElementById('loginId').value.trim();
  var pw = document.getElementById('loginPw').value;
  if (!id || !pw) { document.getElementById('loginErr').textContent = '입력하세요.'; return; }

  var cfg = getConfig();
  if ((cfg.adminId === id || cfg.adminEmail === id) && (cfg.adminPw === pw)) {
    document.getElementById('loginGate').remove();
    loginMode = 'admin';
    visibleChildIds = null;
    authenticated = true;
    document.getElementById('logoutBtn').style.display = '';
    document.getElementById('parentShareCard').style.display = '';
    document.getElementById('mySettingsCard').style.display = '';
    addParentFilter();
    kakao.maps.load(initMap);
    return;
  }

  var parent = getParents().find(function(p) { return p.loginId === id; });
  if (parent && parent.loginPw === pw) {
    document.getElementById('loginGate').remove();
    loginMode = 'parent';
    currentParentId = parent.id;
    visibleChildIds = parent.childIds || [];
    authenticated = true;
    document.getElementById('logoutBtn').style.display = '';
    document.getElementById('childMgmtCard').style.display = '';
    document.getElementById('parentShareCard').style.display = '';
    document.getElementById('mySettingsCard').style.display = '';
    kakao.maps.load(function() { initMap(); renderMyChildList(); });
    return;
  }

  document.getElementById('loginErr').textContent = '아이디 또는 비밀번호 오류';
  document.getElementById('loginPw').value = '';
}

function doLogout() {
  if (parentShareActive) stopParentShare();
  location.reload();
}

function addParentFilter() {
  var parents = getParents();
  if (!parents.length) return;
  var h = '<select id="parentFilter" onchange="applyParentFilter()" style="width:100%;margin-bottom:8px;font-size:12px;">'
    + '<option value="all">👁 전체 보기</option>';
  parents.forEach(function(p) { h += '<option value="' + p.id + '">👤 ' + p.name + '</option>'; });
  h += '</select>';
  document.getElementById('parentFilterWrap').innerHTML = h;
}

function applyParentFilter() {
  var val = document.getElementById('parentFilter').value;
  if (val === 'all') { visibleChildIds = null; }
  else {
    var p = getParents().find(function(x) { return x.id === val; });
    visibleChildIds = p ? (p.childIds || []) : [];
  }
  render();
}

function getVisibleChildren() {
  var children = getChildren();
  if (!visibleChildIds) return children;
  return children.filter(function(c) { return visibleChildIds.indexOf(c.id) !== -1; });
}

// ──── 부모: 자녀 등록 ────
function renderMyChildList() {
  if (loginMode !== 'parent' || !currentParentId) return;
  var parent = getParents().find(function(p) { return p.id === currentParentId; });
  var ids = parent ? (parent.childIds || []) : [];
  var children = getChildren();
  var el = document.getElementById('myChildList');
  if (!ids.length) { el.innerHTML = '<div class="muted" style="padding:8px;text-align:center;">등록된 자녀가 없습니다.</div>'; return; }
  var html = '';
  ids.forEach(function(cid) {
    var c = children.find(function(x) { return x.id === cid; });
    if (!c) return;
    html += '<div style="display:flex;align-items:center;gap:8px;padding:8px;background:#f8f9fa;border-radius:6px;margin-top:6px;">'
      + '<span style="font-size:20px;">' + (c.emoji||'📍') + '</span>'
      + '<div style="flex:1;min-width:0;">'
      + '<div style="font-weight:600;font-size:13px;">' + c.name
      + (c.phone ? ' <a href="tel:' + c.phone + '" style="font-size:11px;color:#3498db;text-decoration:none;">📞</a>' : '') + '</div>'
      + '<div style="font-size:12px;color:#888;">코드: <b style="color:#2c3e50;font-size:14px;letter-spacing:2px;">' + (c.code||'없음') + '</b>'
      + (c.phone ? ' · ' + c.phone : '') + '</div>'
      + '</div>'
      + '<button onclick="copyCode(\'' + (c.code||'') + '\')" style="background:#3498db;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer;">복사</button>'
      + '</div>';
  });
  el.innerHTML = html;
}

function copyCode(code) {
  if (!code) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(function() { alert('코드 ' + code + ' 복사됨!'); });
  } else {
    prompt('이 코드를 아이에게 알려주세요:', code);
  }
}

function hideMyChildForm() { document.getElementById('myChildForm').style.display = 'none'; }
function saveMyChild() {
  var name = document.getElementById('mcName').value.trim();
  if (!name) { alert('이름을 입력하세요.'); return; }
  var phone = document.getElementById('mcPhone').value.trim();
  var childId = uid();
  var code = generateCode();
  var childData = {
    name: name, emoji: document.getElementById('mcEmoji').value || '🐻',
    color: document.getElementById('mcColor').value || '#FF6B6B',
    code: code, order: getChildren().length + 1
  };
  if (phone) childData.phone = phone;
  fbDb.ref('/children/' + childId).set(childData);
  var parent = getParents().find(function(p) { return p.id === currentParentId; });
  if (parent) {
    var ids = parent.childIds || [];
    if (ids.indexOf(childId) === -1) {
      ids.push(childId);
      fbDb.ref('/parents/' + currentParentId + '/childIds').set(ids);
      visibleChildIds = ids;
    }
  }
  hideMyChildForm();
  setTimeout(function() {
    render();
    renderMyChildList();
    alert('자녀 등록 완료!\n접속 코드: ' + code + '\n\n이 코드를 아이에게 알려주세요.');
  }, 500);
}
function removeMyChild(childId, childName) {
  if (!confirm(childName + ' 해제?')) return;
  var parent = getParents().find(function(p) { return p.id === currentParentId; });
  if (parent) {
    var ids = (parent.childIds||[]).filter(function(id) { return id !== childId; });
    fbDb.ref('/parents/' + currentParentId + '/childIds').set(ids);
    visibleChildIds = ids;
    setTimeout(function() { render(); renderMyChildList(); }, 500);
  }
}

function editMyPin(pinId) {
  var pin = getPins().find(function(p) { return p.id === pinId; });
  if (!pin) return;
  document.getElementById('pinFormTitle').textContent = '거점 수정';
  document.getElementById('editPinId').value = pinId;
  document.getElementById('pfName').value = pin.name;
  document.getElementById('pfCategory').value = pin.category || 'other';
  document.getElementById('pfEmoji').value = pin.emoji || '📍';
  document.getElementById('pfColor').value = pin.color || '#7f8c8d';
  document.getElementById('pfLat').value = pin.lat || '';
  document.getElementById('pfLng').value = pin.lng || '';
  document.getElementById('pfAddress').value = '';
  document.getElementById('addressResults').innerHTML = '';
  document.getElementById('pinFormCard').style.display = '';
}

function hidePinForm() {
  document.getElementById('pinFormCard').style.display = 'none';
  document.getElementById('pfLat').value = '';
  document.getElementById('pfLng').value = '';
}

function onPinCategoryChange() {
  var cat = PIN_CATEGORIES.find(function(c) { return c.value === document.getElementById('pfCategory').value; }) || PIN_CATEGORIES[4];
  document.getElementById('pfEmoji').value = cat.emoji;
  document.getElementById('pfColor').value = cat.color;
}

function searchPinAddress() {
  var addr = document.getElementById('pfAddress').value.trim();
  if (!addr) { alert('주소를 입력하세요.'); return; }
  if (!geocoder) geocoder = new kakao.maps.services.Geocoder();
  geocoder.addressSearch(addr, function(result, status) {
    if (status === kakao.maps.services.Status.OK && result.length) {
      var html = '';
      result.forEach(function(r) {
        html += '<div style="padding:4px 6px;border-bottom:1px solid #eee;cursor:pointer;font-size:12px;" '
          + 'onclick="selectPinAddr(' + r.y + ',' + r.x + ',\'' + r.address_name.replace(/'/g, "\\'") + '\')">'
          + '📍 ' + r.address_name + '</div>';
      });
      document.getElementById('addressResults').innerHTML = html;
    } else {
      document.getElementById('addressResults').innerHTML = '<div class="muted" style="padding:4px;font-size:11px;">결과 없음</div>';
    }
  });
}

function selectPinAddr(lat, lng, name) {
  document.getElementById('addressResults').innerHTML = '';
  document.getElementById('pfLat').value = lat.toFixed ? lat.toFixed(6) : lat;
  document.getElementById('pfLng').value = lng.toFixed ? lng.toFixed(6) : lng;
  if (!document.getElementById('pfName').value.trim()) document.getElementById('pfName').value = name;
  map.setCenter(new kakao.maps.LatLng(lat, lng));
  map.setLevel(3);
}

function savePin() {
  var name = document.getElementById('pfName').value.trim();
  var lat = parseFloat(document.getElementById('pfLat').value);
  var lng = parseFloat(document.getElementById('pfLng').value);
  if (!name) { alert('이름을 입력하세요.'); return; }
  if (isNaN(lat) || isNaN(lng)) { alert('위치를 지정하세요.\n주소 검색 또는 지도 우클릭으로 좌표를 입력하세요.'); return; }
  var editId = document.getElementById('editPinId').value;
  var id = editId || uid();
  var pins = getPins();
  var order = editId ? ((pins.find(function(p) { return p.id === editId; }) || {}).order || pins.length) : pins.length + 1;
  var createdBy = currentParentId || 'admin';
  fbDb.ref('/pins/' + id).set({
    name: name, emoji: document.getElementById('pfEmoji').value || '📍',
    category: document.getElementById('pfCategory').value || 'other',
    color: document.getElementById('pfColor').value || '#7f8c8d',
    lat: lat, lng: lng, order: order, createdBy: createdBy
  }).then(function() {
    hidePinForm();
  }).catch(function(e) { alert('실패: ' + e.message); });
}

function deleteMyPin(pinId, pinName) {
  if (!confirm(pinName + ' 거점을 삭제할까요?')) return;
  fbDb.ref('/pins/' + pinId).remove();
}

// renderPins에 수정/삭제 버튼 추가 (기존 함수 덮어쓰기)
var _origRenderPins = renderPins;
renderPins = function() {
  pinMarkers.forEach(function(m) { m.setMap(null); });
  pinMarkers = [];
  var pins = getPins();
  if (!pins.length) { document.getElementById('pinLegend').style.display = 'none'; return; }
  document.getElementById('pinLegend').style.display = '';

  var listHtml = '';
  var myId = currentParentId || 'admin';
  pins.forEach(function(pin) {
    var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
    var color = pin.color || cat.color;
    var emoji = pin.emoji || cat.emoji;

    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(pin.lat, pin.lng),
      map: map, image: pinMarkerImage(emoji, color), zIndex: 3
    });
    kakao.maps.event.addListener(marker, 'click', (function(p, c) {
      return function() { showPinModal(p, c); };
    })(pin, cat));
    pinMarkers.push(marker);

    var canEdit = (pin.createdBy === myId || loginMode === 'admin');
    listHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;">'
      + '<span style="font-size:18px;cursor:pointer;" onclick="showPinModal2(\'' + pin.id + '\')">' + emoji + '</span>'
      + '<span style="flex:1;cursor:pointer;" onclick="showPinModal2(\'' + pin.id + '\')">' + pin.name + '</span>'
      + '<span class="muted">(' + cat.label + ')</span>';
    if (canEdit) {
      listHtml += '<button class="small" onclick="editMyPin(\'' + pin.id + '\')" style="font-size:10px;">수정</button>'
        + '<button class="small danger" onclick="deleteMyPin(\'' + pin.id + '\',\'' + pin.name + '\')" style="font-size:10px;">삭제</button>';
    }
    listHtml += '</div>';
  });
  document.getElementById('pinList').innerHTML = listHtml;
};
</script>
