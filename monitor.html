<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>아이들 위치 모니터링</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .map-type-bar {
      position:absolute;top:10px;left:10px;z-index:5;
      display:flex;gap:0;background:rgba(255,255,255,0.95);border-radius:6px;
      box-shadow:0 1px 4px rgba(0,0,0,0.15);overflow:hidden;
    }
    .map-type-btn {
      padding:6px 10px;border:none;background:none;font-size:11px;
      font-weight:600;color:#555;cursor:pointer;border-right:1px solid #e0e0e0;
    }
    .map-type-btn:last-child { border-right:none; }
    .map-type-btn.active { background:#3498db;color:#fff; }
    .child-actions { display:flex;gap:3px;flex-shrink:0; }
    .child-actions button {
      border:none;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer;
    }
    .pin-modal {
      position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;
      display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .pin-modal-box {
      background:#fff;border-radius:12px;padding:20px;max-width:320px;width:100%;text-align:center;
    }
  </style>
</head>
<body>
<header>
  <h1>📍 위치 모니터링</h1>
  <nav>
    <a href="index.html">홈</a>
    <span id="logoutBtn" style="display:none;">
      <a href="#" onclick="doLogout();return false;" style="color:#e74c3c;font-size:12px;">로그아웃</a>
    </span>
  </nav>
</header>

<div class="container" style="max-width:1000px;">
  <div class="card">
    <div class="map-wrap">
      <div id="map" class="map" style="height:500px;"></div>
      <div class="map-type-bar" id="mapTypeBar">
        <button class="map-type-btn active" onclick="setMapType('normal')">지도</button>
        <button class="map-type-btn" onclick="setMapType('skyview')">위성</button>
        <button class="map-type-btn" onclick="setMapType('hybrid')">혼합</button>
      </div>
      <div class="map-ctrl map-ctrl-right">
        <button class="map-btn" onclick="zoomIn()">+</button>
        <button class="map-btn" onclick="zoomOut()">−</button>
      </div>
      <div class="map-ctrl map-ctrl-bottom">
        <button class="map-btn" style="width:auto;padding:0 12px;font-size:13px;font-weight:600;" onclick="fitAll()">전체 보기</button>
      </div>
    </div>
  </div>

  <!-- 부모: 자녀 관리 -->
  <div class="card" id="childMgmtCard" style="display:none;">
    <div class="flex-between">
      <h2>내 자녀 관리</h2>
      <button class="success small" onclick="showAddMyChild()">+ 자녀 등록</button>
    </div>
    <div id="myChildForm" style="display:none;margin-top:8px;padding:10px;background:#f8f9fa;border-radius:6px;">
      <label>자녀 연락처</label>
      <input id="mcPhone" type="tel" inputmode="tel" placeholder="010-0000-0000">
      <label>이름</label>
      <input id="mcName" type="text" placeholder="이름">
      <label>이모지</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="mcEmojiPicker"></div>
      <input id="mcEmoji" type="text" value="🐻" style="width:50px;text-align:center;font-size:18px;">
      <label>색상</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="mcColorPicker"></div>
      <input id="mcColor" type="color" value="#FF6B6B" style="width:50px;height:30px;">
      <div style="margin-top:8px;display:flex;gap:4px;">
        <button class="success small" onclick="saveMyChild()">저장</button>
        <button class="gray small" onclick="hideMyChildForm()">취소</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="flex-between">
      <h2>아이들 상태</h2>
      <span class="muted" id="lastRefresh"></span>
    </div>
    <div id="parentFilterWrap"></div>
    <div id="childList"></div>
    <div id="emptyMsg" class="empty" style="display:none;">등록된 자녀가 없습니다.</div>
  </div>

  <div class="card" id="pinLegend" style="display:none;">
    <h2>거점 목록</h2>
    <div id="pinList"></div>
  </div>
</div>

<!-- 거점 상세 모달 -->
<div class="pin-modal" id="pinModal" style="display:none;" onclick="if(event.target===this)closePinModal()">
  <div class="pin-modal-box">
    <div style="font-size:36px;" id="pmEmoji"></div>
    <h3 id="pmName" style="margin:8px 0 4px;"></h3>
    <div id="pmCategory" class="muted" style="margin-bottom:12px;"></div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
      <button onclick="naviToPinWalk()" style="background:#27ae60;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;">🚶 도보 네비</button>
      <button onclick="naviToPinCar()" style="background:#3498db;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;">🚗 차량 네비</button>
    </div>
    <button onclick="closePinModal()" style="margin-top:12px;background:#95a5a6;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;">닫기</button>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f3f8fa6decb5e2185b09d6bf70ef525b&autoload=false"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
var map = null;
var childMarkers = {};
var childOverlays = {};
var pinMarkers = [];
var authenticated = false;
var loginMode = null;
var currentParentId = null;
var visibleChildIds = null;
var selectedPinData = null;
var distanceLogs = {};
var prevLocations = {};

initFirebaseSync();
onDataReady(function() { showLoginGate(); });

function initMap() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(35.3475, 126.4180), level: 5
  });
  render();
  setInterval(function() { updateList(); trackDistances(); }, 5000);
}

window.onDataChanged = function() { if (authenticated && map) render(); };

function render() {
  renderChildren();
  renderPins();
  updateList();
  document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString('ko-KR');
}

// ──── 지도 타입 ────
function setMapType(type) {
  if (!map) return;
  document.querySelectorAll('.map-type-btn').forEach(function(b) { b.classList.remove('active'); });
  if (type === 'normal') {
    map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
    document.querySelectorAll('.map-type-btn')[0].classList.add('active');
  } else if (type === 'skyview') {
    map.setMapTypeId(kakao.maps.MapTypeId.SKYVIEW);
    document.querySelectorAll('.map-type-btn')[1].classList.add('active');
  } else {
    map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
    document.querySelectorAll('.map-type-btn')[2].classList.add('active');
  }
}

// ──── 이동 거리 추적 ────
function trackDistances() {
  var locations = getLocations();
  getVisibleChildren().forEach(function(child) {
    var loc = locations[child.id];
    if (!loc || !loc.lat || !loc.isActive) return;
    var prev = prevLocations[child.id];
    if (prev && prev.lat && prev.lng) {
      var d = distance(prev.lat, prev.lng, loc.lat, loc.lng);
      if (d > 3 && d < 10000) {
        distanceLogs[child.id] = (distanceLogs[child.id] || 0) + d;
      }
    }
    prevLocations[child.id] = { lat: loc.lat, lng: loc.lng };
  });
}

function getDistanceText(childId) {
  var m = distanceLogs[childId] || 0;
  if (m < 10) return '';
  if (m < 1000) return Math.round(m) + 'm';
  return (m / 1000).toFixed(1) + 'km';
}

// ──── 아이 마커 ────
function renderChildren() {
  var children = getVisibleChildren();
  var locations = getLocations();

  children.forEach(function(child) {
    var loc = locations[child.id];
    if (!loc || !loc.lat) {
      if (childMarkers[child.id]) { childMarkers[child.id].setMap(null); delete childMarkers[child.id]; }
      if (childOverlays[child.id]) { childOverlays[child.id].setMap(null); delete childOverlays[child.id]; }
      return;
    }
    var pos = new kakao.maps.LatLng(loc.lat, loc.lng);
    var stale = isStale(loc.lastUpdate);
    var color = stale ? '#bdc3c7' : (child.color || '#3498db');

    if (childMarkers[child.id]) {
      childMarkers[child.id].setPosition(pos);
      childMarkers[child.id].setImage(emojiMarkerImage(child.emoji || '📍', color, 36));
    } else {
      var marker = new kakao.maps.Marker({
        position: pos, map: map,
        image: emojiMarkerImage(child.emoji || '📍', color, 36), zIndex: 10
      });
      var iw = new kakao.maps.InfoWindow({ content: buildInfoWindow(child, loc), removable: true });
      kakao.maps.event.addListener(marker, 'click', (function(m, i, c) {
        return function() {
          i.setContent(buildInfoWindow(c, getLocations()[c.id]));
          toggleInfoWindow(i, m, map);
        };
      })(marker, iw, child));
      childMarkers[child.id] = marker;
    }

    if (childOverlays[child.id]) {
      childOverlays[child.id].setPosition(pos);
    } else {
      var nameHtml = '<div style="padding:2px 6px;background:' + color + ';color:#fff;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;transform:translateY(4px);">'
        + (child.emoji || '') + ' ' + child.name + '</div>';
      childOverlays[child.id] = new kakao.maps.CustomOverlay({
        position: pos, content: nameHtml, yAnchor: 0, map: map, zIndex: 5
      });
    }
  });
}

function buildInfoWindow(child, loc) {
  if (!loc) return '<div style="padding:8px;">위치 정보 없음</div>';
  var stale = isStale(loc.lastUpdate);
  var sc = stale ? '#e74c3c' : '#27ae60';
  var st = stale ? '오프라인' : '온라인';
  if (loc.isActive === false) { sc = '#e74c3c'; st = '오프라인'; }
  var dist = getDistanceText(child.id);

  var html = '<div style="padding:10px;min-width:180px;font-size:13px;line-height:1.6;">'
    + '<div style="font-weight:700;font-size:14px;margin-bottom:4px;">' + (child.emoji||'') + ' ' + child.name + '</div>'
    + '<div><span style="color:' + sc + ';">● ' + st + '</span></div>'
    + '<div>마지막: ' + timeAgo(loc.lastUpdate) + '</div>';
  if (loc.accuracy) html += '<div>정확도: ' + loc.accuracy + 'm</div>';
  if (loc.batteryLevel != null) html += '<div>🔋 ' + loc.batteryLevel + '%</div>';
  if (dist) html += '<div>📏 이동거리: ' + dist + '</div>';
  if (child.phone) html += '<div><a href="tel:' + child.phone + '" style="color:#3498db;">📞 ' + child.phone + '</a></div>';
  html += '<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;">'
    + '<button onclick="openNaviWalk(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#27ae60;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer;">🚶 도보</button>'
    + '<button onclick="openNaviCar(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#3498db;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer;">🚗 차량</button>'
    + '<button onclick="ringChild(\'' + child.id + '\',\'' + child.name + '\')" style="background:#e74c3c;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer;">🔔 벨</button>'
    + '</div></div>';
  return html;
}

// ──── 네비 (도보/차량) ────
function openNaviWalk(name, lat, lng) {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|Android/.test(ua)) {
    location.href = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=FOOT';
  } else {
    window.open('https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng);
  }
}
function openNaviCar(name, lat, lng) {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|Android/.test(ua)) {
    location.href = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=CAR';
  } else {
    window.open('https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng);
  }
}

// ──── 거점 ────
function renderPins() {
  pinMarkers.forEach(function(m) { m.setMap(null); });
  pinMarkers = [];
  var pins = getPins();
  if (!pins.length) { document.getElementById('pinLegend').style.display = 'none'; return; }
  document.getElementById('pinLegend').style.display = '';

  var listHtml = '';
  pins.forEach(function(pin) {
    var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
    var color = pin.color || cat.color;
    var emoji = pin.emoji || cat.emoji;

    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(pin.lat, pin.lng),
      map: map, image: pinMarkerImage(emoji, color), zIndex: 3
    });
    kakao.maps.event.addListener(marker, 'click', (function(p, c) {
      return function() { showPinModal(p, c); };
    })(pin, cat));

    pinMarkers.push(marker);
    listHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;cursor:pointer;" onclick="showPinModal2(\'' + pin.id + '\')">'
      + '<span style="font-size:18px;">' + emoji + '</span>'
      + '<span style="flex:1;">' + pin.name + '</span>'
      + '<span class="muted">(' + cat.label + ')</span>'
      + '</div>';
  });
  document.getElementById('pinList').innerHTML = listHtml;
}

function showPinModal(pin, cat) {
  selectedPinData = pin;
  document.getElementById('pmEmoji').textContent = pin.emoji || cat.emoji;
  document.getElementById('pmName').textContent = pin.name;
  document.getElementById('pmCategory').textContent = cat.label;
  document.getElementById('pinModal').style.display = '';
}
function showPinModal2(pinId) {
  var pin = getPins().find(function(p) { return p.id === pinId; });
  if (!pin) return;
  var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
  showPinModal(pin, cat);
}
function closePinModal() { document.getElementById('pinModal').style.display = 'none'; selectedPinData = null; }
function naviToPinWalk() {
  if (!selectedPinData) return;
  closePinModal();
  openNaviWalk(selectedPinData.name, selectedPinData.lat, selectedPinData.lng);
}
function naviToPinCar() {
  if (!selectedPinData) return;
  closePinModal();
  openNaviCar(selectedPinData.name, selectedPinData.lat, selectedPinData.lng);
}

// ──── 아이 리스트 ────
function updateList() {
  var children = getVisibleChildren();
  var locations = getLocations();
  if (!children.length) {
    document.getElementById('childList').innerHTML = '';
    document.getElementById('emptyMsg').style.display = '';
    return;
  }
  document.getElementById('emptyMsg').style.display = 'none';

  var html = '';
  children.forEach(function(child) {
    var loc = locations[child.id];
    var stale = !loc || isStale(loc.lastUpdate);
    var active = loc && loc.isActive !== false && !stale;
    var cls = active ? 'list-item online' : 'list-item offline';
    var dist = getDistanceText(child.id);

    html += '<div class="' + cls + '" style="flex-wrap:wrap;">'
      + '<div class="emoji" onclick="focusChild(\'' + child.id + '\')" style="cursor:pointer;">' + (child.emoji || '📍') + '</div>'
      + '<div class="info" onclick="focusChild(\'' + child.id + '\')" style="cursor:pointer;">'
      + '<div class="name">' + child.name;
    if (child.phone) {
      html += ' <a href="tel:' + child.phone + '" onclick="event.stopPropagation()" style="font-size:12px;color:#3498db;text-decoration:none;">📞</a>';
    }
    html += '</div><div class="sub">';

    if (loc && loc.lat) {
      html += (active ? '<span style="color:#27ae60;">●</span>' : '<span style="color:#e74c3c;">●</span>')
        + ' ' + timeAgo(loc.lastUpdate);
      if (loc.batteryLevel != null) html += ' · 🔋' + loc.batteryLevel + '%';
      if (dist) html += ' · 📏' + dist;
    } else {
      html += '위치 정보 없음';
    }

    html += '</div></div><div class="child-actions">';

    if (loc && loc.lat) {
      html += '<button onclick="event.stopPropagation();openNaviWalk(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#27ae60;color:#fff;" title="도보 네비">🚶</button>'
        + '<button onclick="event.stopPropagation();openNaviCar(\'' + child.name + '\',' + loc.lat + ',' + loc.lng + ')" style="background:#3498db;color:#fff;" title="차량 네비">🚗</button>';
    }
    html += '<button onclick="event.stopPropagation();ringChild(\'' + child.id + '\',\'' + child.name + '\')" style="background:#e74c3c;color:#fff;" title="벨 울리기">🔔</button>';

    if (loginMode === 'parent') {
      html += '<button onclick="event.stopPropagation();removeMyChild(\'' + child.id + '\',\'' + child.name + '\')" style="background:#95a5a6;color:#fff;font-size:11px;" title="해제">✕</button>';
    }
    html += '</div></div>';
  });
  document.getElementById('childList').innerHTML = html;
}

function ringChild(childId, childName) {
  if (!confirm(childName + ' 폰에서 벨을 울릴까요?')) return;
  fbDb.ref('/alerts/' + childId).set({ ring: true, timestamp: Date.now() });
  alert(childName + ' 폰에 벨 신호를 보냈습니다.');
  setTimeout(function() { fbDb.ref('/alerts/' + childId).remove(); }, 30000);
}

function focusChild(id) {
  var loc = getLocations()[id];
  if (!loc || !loc.lat) return;
  map.setCenter(new kakao.maps.LatLng(loc.lat, loc.lng));
  map.setLevel(3);
}

function fitAll() {
  if (!map) return;
  var bounds = new kakao.maps.LatLngBounds();
  var has = false;
  var locs = getLocations();
  getVisibleChildren().forEach(function(c) {
    var l = locs[c.id];
    if (l && l.lat) { bounds.extend(new kakao.maps.LatLng(l.lat, l.lng)); has = true; }
  });
  getPins().forEach(function(p) {
    if (p.lat) { bounds.extend(new kakao.maps.LatLng(p.lat, p.lng)); has = true; }
  });
  if (has) map.setBounds(bounds);
}

function zoomIn() { if (map) map.setLevel(Math.max(1, map.getLevel() - 1)); }
function zoomOut() { if (map) map.setLevel(Math.min(14, map.getLevel() + 1)); }

// ──── 로그인 ────
function showLoginGate() {
  var html = '<div class="pin-gate" id="loginGate">'
    + '<div class="pin-box" style="max-width:300px;">'
    + '<div style="font-size:36px;margin-bottom:6px;">👋</div>'
    + '<h2 style="color:#2c3e50;margin-bottom:12px;font-size:16px;">로그인</h2>'
    + '<input id="loginId" type="text" placeholder="아이디" style="margin-bottom:6px;font-size:13px;">'
    + '<input id="loginPw" type="password" placeholder="비밀번호" style="font-size:13px;" onkeydown="if(event.key===\'Enter\')doLogin()">'
    + '<div id="loginErr" style="color:#e74c3c;font-size:11px;margin-top:4px;min-height:14px;"></div>'
    + '<button onclick="doLogin()" style="width:100%;margin-top:6px;padding:10px;font-size:14px;font-weight:600;">로그인</button>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  setTimeout(function() { document.getElementById('loginId').focus(); }, 100);
}

function doLogin() {
  var id = document.getElementById('loginId').value.trim();
  var pw = document.getElementById('loginPw').value;
  if (!id || !pw) { document.getElementById('loginErr').textContent = '입력하세요.'; return; }

  var cfg = getConfig();
  if ((cfg.adminId === id || cfg.adminEmail === id) && (cfg.adminPw === pw)) {
    document.getElementById('loginGate').remove();
    loginMode = 'admin';
    visibleChildIds = null;
    authenticated = true;
    document.getElementById('logoutBtn').style.display = '';
    addParentFilter();
    kakao.maps.load(initMap);
    return;
  }

  var parent = getParents().find(function(p) { return p.loginId === id; });
  if (parent && parent.loginPw === pw) {
    document.getElementById('loginGate').remove();
    loginMode = 'parent';
    currentParentId = parent.id;
    visibleChildIds = parent.childIds || [];
    authenticated = true;
    document.getElementById('logoutBtn').style.display = '';
    document.getElementById('childMgmtCard').style.display = '';
    kakao.maps.load(initMap);
    return;
  }

  document.getElementById('loginErr').textContent = '아이디 또는 비밀번호 오류';
  document.getElementById('loginPw').value = '';
}

function doLogout() { location.reload(); }

function addParentFilter() {
  var parents = getParents();
  if (!parents.length) return;
  var h = '<select id="parentFilter" onchange="applyParentFilter()" style="width:100%;margin-bottom:8px;font-size:12px;">'
    + '<option value="all">👁 전체 보기</option>';
  parents.forEach(function(p) { h += '<option value="' + p.id + '">👤 ' + p.name + '</option>'; });
  h += '</select>';
  document.getElementById('parentFilterWrap').innerHTML = h;
}

function applyParentFilter() {
  var val = document.getElementById('parentFilter').value;
  if (val === 'all') { visibleChildIds = null; }
  else {
    var p = getParents().find(function(x) { return x.id === val; });
    visibleChildIds = p ? (p.childIds || []) : [];
  }
  render();
}

function getVisibleChildren() {
  var children = getChildren();
  if (!visibleChildIds) return children;
  return children.filter(function(c) { return visibleChildIds.indexOf(c.id) !== -1; });
}

// ──── 부모: 자녀 등록 ────
function showAddMyChild() {
  var idx = getChildren().length;
  document.getElementById('mcEmoji').value = CHILD_EMOJIS[idx % CHILD_EMOJIS.length];
  document.getElementById('mcColor').value = CHILD_COLORS[idx % CHILD_COLORS.length];
  document.getElementById('mcPhone').value = '';
  document.getElementById('mcName').value = '';
  buildMyChildPickers();
  document.getElementById('myChildForm').style.display = '';
}
function buildMyChildPickers() {
  var eh = ''; CHILD_EMOJIS.forEach(function(e) {
    eh += '<button type="button" onclick="document.getElementById(\'mcEmoji\').value=\'' + e + '\'" style="font-size:18px;background:none;border:1px solid #ddd;border-radius:4px;padding:3px 6px;cursor:pointer;">' + e + '</button>';
  });
  document.getElementById('mcEmojiPicker').innerHTML = eh;
  var ch = ''; CHILD_COLORS.forEach(function(c) {
    ch += '<button type="button" onclick="document.getElementById(\'mcColor\').value=\'' + c + '\'" style="width:24px;height:24px;border-radius:50%;background:' + c + ';border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0;"></button>';
  });
  document.getElementById('mcColorPicker').innerHTML = ch;
}
function hideMyChildForm() { document.getElementById('myChildForm').style.display = 'none'; }
function saveMyChild() {
  var phone = document.getElementById('mcPhone').value.trim();
  var name = document.getElementById('mcName').value.trim();
  if (!phone || !name) { alert('연락처와 이름을 입력하세요.'); return; }
  var norm = phone.replace(/[^0-9]/g, '');
  var existing = getChildren().find(function(c) { return (c.phone||'').replace(/[^0-9]/g,'') === norm; });
  var childId = existing ? existing.id : uid();
  if (!existing) {
    fbDb.ref('/children/' + childId).set({
      name: name, emoji: document.getElementById('mcEmoji').value || '🐻',
      color: document.getElementById('mcColor').value || '#FF6B6B',
      phone: phone, order: getChildren().length + 1
    });
  }
  var parent = getParents().find(function(p) { return p.id === currentParentId; });
  if (parent) {
    var ids = parent.childIds || [];
    if (ids.indexOf(childId) === -1) {
      ids.push(childId);
      fbDb.ref('/parents/' + currentParentId + '/childIds').set(ids);
      visibleChildIds = ids;
    }
  }
  hideMyChildForm();
  setTimeout(render, 500);
}
function removeMyChild(childId, childName) {
  if (!confirm(childName + ' 해제?')) return;
  var parent = getParents().find(function(p) { return p.id === currentParentId; });
  if (parent) {
    var ids = (parent.childIds||[]).filter(function(id) { return id !== childId; });
    fbDb.ref('/parents/' + currentParentId + '/childIds').set(ids);
    visibleChildIds = ids;
    setTimeout(render, 500);
  }
}
</script>
