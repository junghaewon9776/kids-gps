<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>아이들 위치추적</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero-btn {
      display: block;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #fff;
      text-decoration: none;
      border-radius: 24px;
      padding: 50px 20px;
      text-align: center;
      max-width: 400px;
      margin: 24px auto;
      box-shadow: 0 8px 30px rgba(39,174,96,0.35);
      transition: transform 0.15s;
    }
    .hero-btn:active { transform: scale(0.97); }
    .hero-btn .hero-icon { font-size: 80px; margin-bottom: 10px; }
    .hero-btn .hero-title { font-size: 28px; font-weight: 800; }
    .hero-btn .hero-desc { font-size: 15px; opacity: 0.9; margin-top: 8px; }
    .parent-btn {
      display: block;
      background: #fff;
      color: #2c3e50;
      text-decoration: none;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      max-width: 400px;
      margin: 10px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 14px;
      font-weight: 600;
    }
    .parent-btn .icon { font-size: 20px; margin-right: 6px; }
    .parent-btn .desc { font-size: 11px; color: #999; margin-top: 2px; font-weight: 400; }
    .admin-link {
      text-align: center; margin-top: 24px; padding-bottom: 20px;
    }
    .admin-link a {
      font-size: 11px; color: #ccc; text-decoration: none;
    }
  </style>
</head>
<body>
<header>
  <h1>📍 아이들 위치추적</h1>
  <span id="syncStatus" style="font-size:11px;opacity:0.7;">연결 중...</span>
</header>

<div class="container">
  <a href="child.html" class="hero-btn">
    <div class="hero-icon">📡</div>
    <div class="hero-title">내 위치 알려주기</div>
    <div class="hero-desc">여기를 눌러주세요!</div>
  </a>

  <a href="monitor.html" class="parent-btn">
    <span class="icon">🗺️</span> 부모님 로그인
    <div class="desc">자녀 위치 확인 · 모니터링</div>
  </a>

  <div class="admin-link">
    <a href="admin.html">🔧 관리자</a> · <a href="gps-setup.html">📱 GPS 앱 연동</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
initFirebaseSync();
onDataReady(function() {
  document.getElementById('syncStatus').textContent = '✅ 연결됨';
});
</script>
</body>
</html>
