<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>아이들 위치추적</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero-btn {
      display: block;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      padding: 40px 20px;
      text-align: center;
      max-width: 400px;
      margin: 20px auto;
      box-shadow: 0 8px 30px rgba(39,174,96,0.35);
      transition: transform 0.15s;
    }
    .hero-btn:active { transform: scale(0.97); }
    .hero-btn .hero-icon { font-size: 72px; margin-bottom: 8px; }
    .hero-btn .hero-title { font-size: 24px; font-weight: 800; }
    .hero-btn .hero-desc { font-size: 14px; opacity: 0.9; margin-top: 6px; }
    .sub-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      max-width: 400px; margin: 12px auto;
    }
    .sub-card {
      background: #fff;
      padding: 18px 12px;
      border-radius: 12px;
      text-decoration: none;
      color: #2c3e50;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .sub-card .icon { font-size: 28px; margin-bottom: 4px; }
    .sub-card .title { font-weight: 600; font-size: 14px; }
    .sub-card .desc { font-size: 11px; color: #888; margin-top: 2px; }
    .admin-link {
      text-align: center; margin-top: 20px; padding-bottom: 20px;
    }
    .admin-link a {
      font-size: 11px; color: #bbb; text-decoration: none;
    }
  </style>
</head>
<body>
<header>
  <h1>📍 아이들 위치추적</h1>
  <span id="syncStatus" style="font-size:11px;opacity:0.7;">연결 중...</span>
</header>

<div class="container">
  <a href="child.html" class="hero-btn">
    <div class="hero-icon">📡</div>
    <div class="hero-title">위치 전송 시작</div>
    <div class="hero-desc">아이 폰에서 눌러주세요</div>
  </a>

  <div class="sub-grid">
    <a href="monitor.html" class="sub-card">
      <div class="icon">🗺️</div>
      <div class="title">모니터링</div>
      <div class="desc">부모 로그인</div>
    </a>
    <a href="child.html" class="sub-card">
      <div class="icon">📱</div>
      <div class="title">위치 전송</div>
      <div class="desc">아이 폰에서 열기</div>
    </a>
  </div>

  <div class="admin-link">
    <a href="admin.html">🔧 관리자</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
initFirebaseSync();
onDataReady(function() {
  document.getElementById('syncStatus').textContent = '✅ 연결됨';
});
</script>
</body>
</html>
