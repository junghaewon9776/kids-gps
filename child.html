<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>내 위치 알려주기</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .code-input {
      text-align:center;font-size:32px;letter-spacing:8px;padding:16px;
      font-weight:800;text-transform:uppercase;max-width:200px;margin:0 auto;
    }
    .pin-modal {
      position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;
      display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .pin-modal-box {
      background:#fff;border-radius:12px;padding:20px;max-width:320px;width:100%;text-align:center;
    }
    .child-pin-btn {
      display:block;width:100%;padding:14px;margin-top:8px;
      background:linear-gradient(135deg,#f39c12,#e67e22);
      color:#fff;border:none;border-radius:10px;
      font-size:15px;font-weight:700;cursor:pointer;
    }
    .child-pin-btn:active { transform:scale(0.97); }
    .my-pins-list .pin-item {
      display:flex;align-items:center;gap:8px;padding:6px 8px;
      background:#f8f9fa;border-radius:6px;margin-bottom:4px;font-size:13px;
    }
    .sos-btn {
      display:block;width:100%;padding:16px;
      background:#e74c3c;color:#fff;border:none;border-radius:12px;
      font-size:18px;font-weight:700;cursor:pointer;
      animation: sos-pulse 2s infinite;
    }
    @keyframes sos-pulse {
      0%,100% { box-shadow:0 0 0 0 rgba(231,76,60,0.4); }
      50% { box-shadow:0 0 0 8px rgba(231,76,60,0); }
    }
    .connected-banner {
      background:linear-gradient(135deg,#27ae60,#2ecc71);
      color:#fff;border-radius:16px;padding:20px;text-align:center;
    }
    .disconnect-link {
      display:inline-block;margin-top:12px;font-size:11px;color:rgba(255,255,255,0.6);
      text-decoration:underline;cursor:pointer;
    }
  </style>
</head>
<body>
<header>
  <h1>📡 내 위치 알려주기</h1>
  <nav><a href="index.html">홈</a></nav>
</header>

<div class="container">
  <!-- 코드 입력 -->
  <div class="card child-status" id="codeCard">
    <div class="big-emoji">🔑</div>
    <div class="child-name">코드를 입력하세요</div>
    <div style="margin-top:16px;max-width:280px;margin-left:auto;margin-right:auto;">
      <input id="codeInput" class="code-input" type="text" maxlength="4" placeholder="A3K7"
        autocomplete="off" autocapitalize="characters"
        onkeydown="if(event.key==='Enter')connectWithCode()">
      <button onclick="connectWithCode()" style="width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:700;background:#27ae60;color:#fff;border:none;border-radius:10px;cursor:pointer;">연결하기</button>
      <p class="muted" style="margin-top:10px;">부모님한테 받은 4자리 코드를 입력해요</p>
    </div>
  </div>

  <!-- 연결 완료 + GPS -->
  <div class="card" id="statusCard" style="display:none;">
    <div class="connected-banner">
      <div style="font-size:48px;" id="childEmoji">📡</div>
      <div style="font-size:22px;font-weight:800;margin-top:4px;" id="childName">...</div>
      <div id="statusArea" style="margin-top:12px;">
        <div style="font-size:14px;opacity:0.9;">GPS 연결 중...</div>
      </div>
      <span class="disconnect-link" onclick="disconnect()">연결 해제</span>
    </div>
  </div>

  <div class="card" id="mapCard" style="display:none;">
    <div class="map-wrap">
      <div id="map" class="map" style="height:280px;"></div>
    </div>
  </div>

  <!-- 아이 핑 -->
  <div class="card" id="childPinCard" style="display:none;">
    <button class="child-pin-btn" onclick="placeChildPin()">📍 나 여기서 놀 거야!</button>
    <div id="childPinMsg" style="display:none;margin-top:8px;">
      <div style="text-align:center;margin-bottom:8px;">
        <div id="pinLocLabel" style="font-size:13px;color:#27ae60;font-weight:600;">📍 내 현재 위치</div>
      </div>
      <div style="font-size:12px;color:#888;margin-bottom:4px;">다른 장소에 핑 찍기:</div>
      <div style="display:flex;gap:4px;margin-bottom:6px;">
        <input id="childAddrInput" type="text" placeholder="주소 검색 (예: 법성포)" style="flex:1;font-size:13px;padding:8px;">
        <button onclick="searchChildAddr()" style="background:#3498db;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;">검색</button>
      </div>
      <div id="childAddrResults" style="max-height:100px;overflow-y:auto;margin-bottom:6px;"></div>
      <div style="font-size:11px;color:#aaa;margin-bottom:8px;text-align:center;">또는 지도를 눌러서 위치 선택!</div>
      <input id="childPinMsgInput" type="text" placeholder="메시지 (선택)" style="text-align:center;font-size:13px;">
      <button onclick="confirmChildPin()" style="width:100%;margin-top:6px;padding:10px;background:#f39c12;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">핑 보내기</button>
      <button onclick="cancelChildPin()" style="width:100%;margin-top:4px;padding:8px;background:#95a5a6;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">취소</button>
    </div>
    <div class="my-pins-list" id="myPinsList"></div>
  </div>

  <!-- SOS -->
  <div class="card" id="sosCard" style="display:none;text-align:center;">
    <button class="sos-btn" onclick="sendSOS()">🆘 긴급 SOS</button>
    <p class="muted" style="margin-top:6px;">부모님에게 긴급 알림을 보내요</p>
  </div>

  <div class="card" style="display:none;" id="keepOpenCard">
    <p style="text-align:center;font-size:13px;color:#e67e22;line-height:1.6;">
      <b>이 화면을 열어두세요!</b><br>
      브라우저를 닫으면 위치가 안 보여요
    </p>
  </div>

  <!-- 거점 목록 -->
  <div class="card" id="pinLegendCard" style="display:none;">
    <h2>📌 우리 장소</h2>
    <div id="pinLegendList"></div>
  </div>

  <!-- 알람 -->
  <div class="card" id="alarmCard" style="display:none;">
    <div style="text-align:center;padding:16px;">
      <div style="font-size:48px;animation:pulse-ring 0.5s infinite alternate;">🔔</div>
      <div style="font-size:18px;font-weight:700;color:#e74c3c;margin:8px 0;">부모님이 찾고 있어요!</div>
      <button onclick="stopAlarm()" style="margin-top:8px;padding:12px 32px;background:#e74c3c;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;">알람 끄기</button>
    </div>
  </div>
</div>

<!-- 거점 모달 -->
<div class="pin-modal" id="pinModal" style="display:none;" onclick="if(event.target===this)closePinModal()">
  <div class="pin-modal-box">
    <div style="font-size:36px;" id="pmEmoji"></div>
    <h3 id="pmName" style="margin:8px 0 4px;"></h3>
    <div id="pmCategory" class="muted" style="margin-bottom:12px;"></div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
      <button onclick="naviToPinWalk()" style="background:#27ae60;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;">🚶 걸어가기</button>
      <button onclick="naviToPinCar()" style="background:#3498db;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;">🚗 차로 가기</button>
    </div>
    <button onclick="closePinModal()" style="margin-top:12px;background:#95a5a6;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;">닫기</button>
  </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f3f8fa6decb5e2185b09d6bf70ef525b&libraries=services&autoload=false"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
var childId = null;
var matchedChild = null;
var map = null, myMarker = null;
var pinMarkers = [];
var watchId = null;
var lastWriteTime = 0;
var gpsCount = 0;
var currentLat = null, currentLng = null;
var selectedPinData = null;
var pinLat = null, pinLng = null;
var pinTempMarker = null;
var childGeocoder = null;

initFirebaseSync();

onDataReady(function() {
  var saved = localStorage.getItem('kids_code');
  if (saved) {
    var found = findChildByCode(saved);
    if (found) {
      document.getElementById('codeCard').style.display = 'none';
      document.getElementById('statusCard').style.display = '';
      startTracking(found);
      return;
    }
    localStorage.removeItem('kids_code');
  }
});

function connectWithCode() {
  var code = document.getElementById('codeInput').value.trim();
  if (!code) { alert('코드를 입력해주세요!'); return; }

  var found = findChildByCode(code);
  if (!found) {
    alert('코드가 맞지 않아요.\n부모님한테 다시 확인해보세요!');
    return;
  }

  localStorage.setItem('kids_code', code.toUpperCase());
  document.getElementById('codeCard').style.display = 'none';
  document.getElementById('statusCard').style.display = '';
  startTracking(found);
}

function disconnect() {
  if (!confirm('연결을 해제할까요?')) return;
  localStorage.removeItem('kids_code');
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  if (childId) {
    fbDb.ref('/locations/' + childId).update({ isActive: false, lastUpdate: Date.now() });
  }
  releaseWakeLock();
  location.reload();
}

function startTracking(child) {
  childId = child.id;
  matchedChild = child;

  document.getElementById('childEmoji').textContent = child.emoji || '📡';
  document.getElementById('childName').textContent = child.name;
  document.title = child.name + ' - 위치 알려주기';

  document.getElementById('childPinCard').style.display = '';
  document.getElementById('sosCard').style.display = '';

  startGPS(child);
  renderMyPins();
}

function startGPS(child) {
  if (!navigator.geolocation) {
    document.getElementById('statusArea').innerHTML = '<p style="color:#fff;opacity:0.9;">이 브라우저에서는 위치를 못 찾아요 😢</p>';
    return;
  }

  document.getElementById('statusArea').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;">'
    + '<span class="pulse" style="background:#fff;"></span>'
    + '<span id="statusText" style="font-size:14px;">위치 찾는 중...</span>'
    + '</div>'
    + '<div id="gpsInfo" style="font-size:11px;opacity:0.7;"></div>'
    + '<div id="sendCount" style="font-size:11px;opacity:0.7;margin-top:2px;"></div>';

  document.getElementById('mapCard').style.display = '';
  document.getElementById('keepOpenCard').style.display = '';

  kakao.maps.load(function() {
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(35.3475, 126.4180), level: 5
    });
    childGeocoder = new kakao.maps.services.Geocoder();
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
      var latlng = mouseEvent.latLng;
      setPinLocation(latlng.getLat(), latlng.getLng(), '지도에서 선택한 위치');
    });
    renderPinsOnMap();
  });

  var cfg = getConfig();
  var intervalMs = (cfg.gpsIntervalSec || 15) * 1000;

  watchId = navigator.geolocation.watchPosition(
    function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var acc = pos.coords.accuracy;
      currentLat = lat;
      currentLng = lng;

      document.getElementById('statusText').textContent = '위치 보내는 중!';
      document.getElementById('gpsInfo').textContent =
        lat.toFixed(5) + ', ' + lng.toFixed(5) + ' (정확도 ' + Math.round(acc) + 'm)';

      if (map) {
        var latlng = new kakao.maps.LatLng(lat, lng);
        map.setCenter(latlng);
        if (!myMarker) {
          myMarker = new kakao.maps.Marker({
            position: latlng, map: map,
            image: emojiMarkerImage(child.emoji || '📍', child.color || '#3498db', 36)
          });
          map.setLevel(3);
        } else {
          myMarker.setPosition(latlng);
        }
      }

      var now = Date.now();
      if (now - lastWriteTime >= intervalMs) {
        lastWriteTime = now;
        var payload = {
          lat: lat, lng: lng, accuracy: Math.round(acc),
          timestamp: now, lastUpdate: now, isActive: true
        };

        if ('getBattery' in navigator) {
          navigator.getBattery().then(function(b) {
            payload.batteryLevel = Math.round(b.level * 100);
            fbDb.ref('/locations/' + childId).set(payload);
          }).catch(function() {
            fbDb.ref('/locations/' + childId).set(payload);
          });
        } else {
          fbDb.ref('/locations/' + childId).set(payload);
        }

        gpsCount++;
        document.getElementById('sendCount').textContent = '전송 ' + gpsCount + '회';
      }
    },
    function(err) {
      document.getElementById('statusText').textContent = '위치를 못 찾겠어요 😢';
      document.getElementById('gpsInfo').textContent = err.message;
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );

  requestWakeLock();
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && watchId && !_wakeLock) requestWakeLock();
  });

  fbDb.ref('/locations/' + childId).onDisconnect().update({
    isActive: false, lastUpdate: firebase.database.ServerValue.TIMESTAMP
  });

  window.addEventListener('beforeunload', function() {
    fbDb.ref('/locations/' + childId).update({ isActive: false, lastUpdate: Date.now() });
  });

  listenAlarm();
}

// ──── 거점 표시 ────
window.onDataChanged = function() {
  if (map && childId) renderPinsOnMap();
  if (childId) renderMyPins();
};

function renderPinsOnMap() {
  pinMarkers.forEach(function(m) { m.setMap(null); });
  pinMarkers = [];

  getPins().forEach(function(pin) {
    var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(pin.lat, pin.lng),
      map: map, image: pinMarkerImage(pin.emoji || cat.emoji, pin.color || cat.color), zIndex: 3
    });
    kakao.maps.event.addListener(marker, 'click', (function(p, c) {
      return function() { showPinModal(p, c); };
    })(pin, cat));
    pinMarkers.push(marker);
  });

  getChildPins().forEach(function(cp) {
    if (cp.childId === childId) return;
    var c = getChildren().find(function(x) { return x.id === cp.childId; });
    var emoji = c ? (c.emoji || '📍') : '📍';
    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(cp.lat, cp.lng),
      map: map, image: pinMarkerImage(emoji, '#f39c12'), zIndex: 2
    });
    var iw = new kakao.maps.InfoWindow({
      content: '<div style="padding:8px;font-size:12px;min-width:120px;">'
        + '<b>' + emoji + ' ' + (c ? c.name : '?') + '</b>'
        + (cp.message ? '<div style="margin-top:4px;">' + cp.message + '</div>' : '')
        + '<div class="muted">' + timeAgo(cp.timestamp) + '</div></div>',
      removable: true
    });
    kakao.maps.event.addListener(marker, 'click', (function(m, i) {
      return function() { toggleInfoWindow(i, m, map); };
    })(marker, iw));
    pinMarkers.push(marker);
  });

  // 부모 위치도 표시
  var plocs = getParentLocations();
  var parents = getParents();
  Object.keys(plocs).forEach(function(pid) {
    var pl = plocs[pid];
    if (!pl || !pl.lat || !pl.isActive) return;
    if (isStale(pl.timestamp)) return;
    var parent = parents.find(function(p) { return p.id === pid; });
    var name = parent ? parent.name : (pid === 'admin' ? '관리자' : '보호자');
    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(pl.lat, pl.lng),
      map: map, image: emojiMarkerImage('👤', '#8e44ad', 32), zIndex: 6
    });
    var iw = new kakao.maps.InfoWindow({
      content: '<div style="padding:8px;font-size:12px;"><b>👤 ' + name + '</b><div class="muted">' + timeAgo(pl.timestamp) + '</div></div>',
      removable: true
    });
    kakao.maps.event.addListener(marker, 'click', (function(m, i) {
      return function() { toggleInfoWindow(i, m, map); };
    })(marker, iw));
    pinMarkers.push(marker);
  });

  renderPinLegend();
}

function renderPinLegend() {
  var pins = getPins();
  if (!pins.length) { document.getElementById('pinLegendCard').style.display = 'none'; return; }
  document.getElementById('pinLegendCard').style.display = '';
  var html = '';
  pins.forEach(function(pin) {
    var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
    html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;cursor:pointer;" onclick="showPinModal2(\'' + pin.id + '\')">'
      + '<span style="font-size:18px;">' + (pin.emoji || cat.emoji) + '</span>'
      + '<span style="flex:1;">' + pin.name + '</span>'
      + '<span class="muted">' + cat.label + '</span></div>';
  });
  document.getElementById('pinLegendList').innerHTML = html;
}

// ──── 거점 모달+네비 ────
function showPinModal(pin, cat) {
  selectedPinData = pin;
  document.getElementById('pmEmoji').textContent = pin.emoji || cat.emoji;
  document.getElementById('pmName').textContent = pin.name;
  document.getElementById('pmCategory').textContent = cat.label;
  document.getElementById('pinModal').style.display = '';
}
function showPinModal2(pinId) {
  var pin = getPins().find(function(p) { return p.id === pinId; });
  if (!pin) return;
  var cat = PIN_CATEGORIES.find(function(c) { return c.value === pin.category; }) || PIN_CATEGORIES[4];
  showPinModal(pin, cat);
}
function closePinModal() { document.getElementById('pinModal').style.display = 'none'; selectedPinData = null; }
function naviToPinWalk() {
  if (!selectedPinData) return; closePinModal();
  openNaviWalk(selectedPinData.name, selectedPinData.lat, selectedPinData.lng);
}
function naviToPinCar() {
  if (!selectedPinData) return; closePinModal();
  openNaviCar(selectedPinData.name, selectedPinData.lat, selectedPinData.lng);
}
function openNaviWalk(name, lat, lng) {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|Android/.test(ua)) location.href = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=FOOT';
  else window.open('https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng);
}
function openNaviCar(name, lat, lng) {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|Android/.test(ua)) location.href = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=CAR';
  else window.open('https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng);
}

// ──── 아이 핑 ────
function placeChildPin() {
  pinLat = currentLat;
  pinLng = currentLng;
  if (pinTempMarker) { pinTempMarker.setMap(null); pinTempMarker = null; }
  document.getElementById('pinLocLabel').textContent = pinLat ? '📍 내 현재 위치' : '⚠️ 위치를 지도에서 선택하세요';
  document.getElementById('childPinMsg').style.display = '';
  document.getElementById('childPinMsgInput').value = '';
  document.getElementById('childAddrInput').value = '';
  document.getElementById('childAddrResults').innerHTML = '';
}
function setPinLocation(lat, lng, label) {
  pinLat = lat;
  pinLng = lng;
  if (pinTempMarker) pinTempMarker.setMap(null);
  pinTempMarker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(lat, lng), map: map, zIndex: 10
  });
  document.getElementById('pinLocLabel').textContent = '📍 ' + (label || '선택한 위치');
  document.getElementById('childPinMsg').style.display = '';
  map.panTo(new kakao.maps.LatLng(lat, lng));
}
function searchChildAddr() {
  var addr = document.getElementById('childAddrInput').value.trim();
  if (!addr) return;
  if (!childGeocoder) childGeocoder = new kakao.maps.services.Geocoder();
  childGeocoder.addressSearch(addr, function(result, status) {
    if (status === kakao.maps.services.Status.OK && result.length) {
      var html = '';
      result.slice(0, 5).forEach(function(r) {
        html += '<div onclick="setPinLocation(' + r.y + ',' + r.x + ',\'' + r.address_name.replace(/'/g, "\\'") + '\')" '
          + 'style="padding:6px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid #eee;">'
          + r.address_name + '</div>';
      });
      document.getElementById('childAddrResults').innerHTML = html;
    } else {
      var ps = new kakao.maps.services.Places();
      ps.keywordSearch(addr, function(data, s2) {
        if (s2 === kakao.maps.services.Status.OK && data.length) {
          var html = '';
          data.slice(0, 5).forEach(function(d) {
            html += '<div onclick="setPinLocation(' + d.y + ',' + d.x + ',\'' + d.place_name.replace(/'/g, "\\'") + '\')" '
              + 'style="padding:6px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid #eee;">'
              + d.place_name + ' <span style="color:#999;font-size:11px;">' + (d.address_name||'') + '</span></div>';
          });
          document.getElementById('childAddrResults').innerHTML = html;
        } else {
          document.getElementById('childAddrResults').innerHTML = '<div style="padding:6px;font-size:12px;color:#999;">검색 결과가 없어요</div>';
        }
      });
    }
  });
}
function confirmChildPin() {
  if (!childId) return;
  if (!pinLat || !pinLng) { alert('위치를 선택해주세요!\n지도를 누르거나 주소를 검색하세요.'); return; }
  var msg = document.getElementById('childPinMsgInput').value.trim();
  fbDb.ref('/childPins/' + uid()).set({
    childId: childId, lat: pinLat, lng: pinLng,
    message: msg || '나 여기있어!', timestamp: Date.now()
  });
  if (pinTempMarker) { pinTempMarker.setMap(null); pinTempMarker = null; }
  document.getElementById('childPinMsgInput').value = '';
  document.getElementById('childAddrInput').value = '';
  document.getElementById('childAddrResults').innerHTML = '';
  pinLat = currentLat;
  pinLng = currentLng;
  document.getElementById('pinLocLabel').textContent = pinLat ? '📍 내 현재 위치' : '📍 위치를 선택하세요';
}
function cancelChildPin() {
  document.getElementById('childPinMsg').style.display = 'none';
  if (pinTempMarker) { pinTempMarker.setMap(null); pinTempMarker = null; }
  pinLat = null; pinLng = null;
}

function renderMyPins() {
  var mine = getChildPins().filter(function(p) { return p.childId === childId; });
  var list = document.getElementById('myPinsList');
  if (!mine.length) { list.innerHTML = ''; return; }
  var html = '<div style="margin-top:8px;font-size:12px;color:#888;margin-bottom:4px;">내 핑</div>';
  mine.forEach(function(p) {
    html += '<div class="pin-item">'
      + '<span>📍</span>'
      + '<span style="flex:1;">' + (p.message || '') + '</span>'
      + '<span class="muted" style="font-size:11px;">' + timeAgo(p.timestamp) + '</span>'
      + '<button onclick="removeChildPin(\'' + p.id + '\')" style="background:#e74c3c;color:#fff;border:none;padding:2px 6px;border-radius:4px;font-size:11px;cursor:pointer;">✕</button>'
      + '</div>';
  });
  list.innerHTML = html;
}
function removeChildPin(pinId) { fbDb.ref('/childPins/' + pinId).remove(); }

// ──── SOS ────
function sendSOS() {
  if (!childId) return;
  if (!confirm('긴급 SOS를 보낼까요?')) return;
  fbDb.ref('/alerts/' + childId).set({
    ring: true, sos: true, timestamp: Date.now(),
    lat: currentLat, lng: currentLng
  });
  alert('SOS를 보냈어요!');
}

// ──── 알람 ────
var alarmCtx = null, alarmNodes = [], alarmInterval = null;

function listenAlarm() {
  fbDb.ref('/alerts/' + childId).on('value', function(snap) {
    var data = snap.val();
    if (data && data.ring && !data.sos) playAlarm();
  });
}
function playAlarm() {
  document.getElementById('alarmCard').style.display = '';
  if (!alarmCtx) alarmCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (alarmCtx.state === 'suspended') alarmCtx.resume();
  stopAlarmSound();
  function beep() {
    var osc = alarmCtx.createOscillator(), gain = alarmCtx.createGain();
    osc.type = 'square'; osc.frequency.value = 1200; gain.gain.value = 1;
    osc.connect(gain); gain.connect(alarmCtx.destination);
    var now = alarmCtx.currentTime;
    gain.gain.setValueAtTime(1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.3); alarmNodes.push(osc);
    var osc2 = alarmCtx.createOscillator(), gain2 = alarmCtx.createGain();
    osc2.type = 'square'; osc2.frequency.value = 1600; gain2.gain.value = 1;
    osc2.connect(gain2); gain2.connect(alarmCtx.destination);
    gain2.gain.setValueAtTime(0.01, now);
    gain2.gain.setValueAtTime(1, now + 0.3);
    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
    osc2.start(now + 0.3); osc2.stop(now + 0.6); alarmNodes.push(osc2);
  }
  beep(); alarmInterval = setInterval(beep, 800);
  setTimeout(function() { stopAlarm(); }, 30000);
}
function stopAlarmSound() {
  if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
  alarmNodes.forEach(function(n) { try { n.stop(); } catch(e) {} }); alarmNodes = [];
}
function stopAlarm() {
  stopAlarmSound();
  document.getElementById('alarmCard').style.display = 'none';
  fbDb.ref('/alerts/' + childId).remove();
}
</script>
