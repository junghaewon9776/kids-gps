<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>관리자</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-login { max-width: 300px; margin: 60px auto; text-align: center; }
    .admin-login input { margin-bottom: 8px; }
    .compact-card { padding: 10px; margin-bottom: 8px; }
    .compact-card h2 { font-size: 13px; margin-bottom: 6px; }
    .compact-item {
      padding: 6px 8px; border: 1px solid #eee; border-radius: 4px;
      margin-bottom: 4px; background: #fafafa; display: flex;
      align-items: center; gap: 8px; font-size: 12px;
    }
    .compact-item .name { font-weight: 600; }
    .compact-item .sub { font-size: 11px; color: #888; }
  </style>
</head>
<body>
<header style="padding:8px 16px;">
  <h1 style="font-size:14px;">🔧 관리자</h1>
  <nav>
    <a href="index.html" style="font-size:12px;">홈</a>
    <a href="#" onclick="localStorage.removeItem('kids_admin_login');location.reload();return false;" style="font-size:11px;color:#e74c3c;margin-left:8px;">로그아웃</a>
  </nav>
</header>

<!-- 로그인 화면 -->
<div id="adminLoginScreen" class="admin-login">
  <div style="font-size:36px;margin-bottom:8px;">🔧</div>
  <h2 style="color:#2c3e50;margin-bottom:12px;font-size:15px;">관리자 로그인</h2>
  <input id="adminEmail" type="email" placeholder="이메일" style="font-size:13px;">
  <input id="adminPw" type="password" placeholder="비밀번호" style="font-size:13px;"
    onkeydown="if(event.key==='Enter')adminLogin()">
  <div id="adminErr" style="color:#e74c3c;font-size:11px;min-height:14px;margin-bottom:4px;"></div>
  <button onclick="adminLogin()" style="width:100%;padding:10px;font-size:13px;">로그인</button>
  <p class="muted" style="margin-top:8px;font-size:11px;">최초 접속 시 입력한 이메일/비번이 관리자로 등록됩니다.</p>
</div>

<!-- 관리 화면 -->
<div id="adminPanel" style="display:none;">
<div class="container" style="max-width:600px;">
  <div class="tabs" style="font-size:12px;">
    <button class="tab-btn active" onclick="switchTab('parents')" style="font-size:12px;">👨‍👩‍👧 부모</button>
    <button class="tab-btn" onclick="switchTab('children')" style="font-size:12px;">👶 자녀</button>
    <button class="tab-btn" onclick="switchTab('pins')" style="font-size:12px;">📌 거점</button>
    <button class="tab-btn" onclick="switchTab('settings')" style="font-size:12px;">⚙️ 설정</button>
  </div>

  <!-- 부모 탭 -->
  <div class="tab-panel active" id="tab-parents">
    <div class="card compact-card">
      <div class="flex-between">
        <h2>부모 계정</h2>
        <button class="success small" onclick="showAddParent()">+ 추가</button>
      </div>
      <div id="parentsList"></div>
      <div id="parentsEmpty" class="empty" style="display:none;font-size:12px;">부모 계정을 추가하세요.</div>
    </div>
    <div class="card compact-card" id="parentForm" style="display:none;">
      <h2 id="parentFormTitle">부모 추가</h2>
      <input type="hidden" id="editParentId">
      <label>이름</label>
      <input id="ppName" type="text" placeholder="엄마, 아빠" style="font-size:12px;">
      <label>로그인 아이디</label>
      <input id="ppLoginId" type="text" placeholder="mom" style="font-size:12px;">
      <label>비밀번호</label>
      <input id="ppLoginPw" type="text" placeholder="비밀번호" style="font-size:12px;">
      <label>연락처</label>
      <input id="ppPhone" type="tel" inputmode="tel" placeholder="010-0000-0000" style="font-size:12px;">
      <div style="margin-top:8px;display:flex;gap:4px;">
        <button class="success small" onclick="saveParent()">저장</button>
        <button class="gray small" onclick="hideParentForm()">취소</button>
      </div>
    </div>
    <div class="card compact-card" id="parentChildrenCard" style="display:none;">
      <h2>부모별 자녀 배정</h2>
      <div id="parentChildrenList" style="font-size:12px;"></div>
    </div>
  </div>

  <!-- 자녀 탭 -->
  <div class="tab-panel" id="tab-children">
    <div class="card compact-card">
      <div class="flex-between">
        <h2>자녀 목록</h2>
        <button class="success small" onclick="showAddChild()">+ 추가</button>
      </div>
      <div id="childrenList"></div>
      <div id="childrenEmpty" class="empty" style="display:none;font-size:12px;">자녀를 추가하세요.</div>
    </div>
    <div class="card compact-card" id="childForm" style="display:none;">
      <h2 id="childFormTitle">자녀 추가</h2>
      <input type="hidden" id="editChildId">
      <label>이름</label>
      <input id="cfName" type="text" placeholder="이름" style="font-size:12px;">
      <label>연락처</label>
      <input id="cfPhone" type="tel" inputmode="tel" placeholder="010-0000-0000 (선택)" style="font-size:12px;">
      <label>이모지</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="cfEmojiPicker"></div>
      <input id="cfEmoji" type="text" value="🐻" style="width:50px;text-align:center;font-size:18px;">
      <label>색상</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;" id="cfColorPicker"></div>
      <input id="cfColor" type="color" value="#FF6B6B" style="width:50px;height:30px;">
      <div style="margin-top:8px;display:flex;gap:4px;">
        <button class="success small" onclick="saveChild()">저장</button>
        <button class="gray small" onclick="hideChildForm()">취소</button>
      </div>
    </div>
  </div>

  <!-- 거점 탭 -->
  <div class="tab-panel" id="tab-pins">
    <div class="card compact-card">
      <div class="flex-between">
        <h2>거점</h2>
        <button class="success small" onclick="showAddPin()">+ 추가</button>
      </div>
      <div id="pinsList"></div>
      <div id="pinsEmpty" class="empty" style="display:none;font-size:12px;">거점을 추가하세요.</div>
    </div>
    <div class="card compact-card" id="pinForm" style="display:none;">
      <h2 id="pinFormTitle">거점 추가</h2>
      <input type="hidden" id="editPinId">
      <label>이름</label>
      <input id="pfName" type="text" placeholder="우리집, 학원" style="font-size:12px;">
      <label>카테고리</label>
      <select id="pfCategory" onchange="onCategoryChange()" style="font-size:12px;">
        <option value="home">🏠 집</option>
        <option value="school">🏫 학교</option>
        <option value="academy">📚 학원</option>
        <option value="work">🏢 회사</option>
        <option value="other">📍 기타</option>
      </select>
      <div style="display:flex;gap:6px;">
        <div><label>이모지</label><input id="pfEmoji" type="text" value="🏠" style="width:50px;text-align:center;font-size:18px;"></div>
        <div><label>색상</label><input id="pfColor" type="color" value="#e74c3c" style="width:50px;height:30px;"></div>
      </div>
      <label>주소 검색</label>
      <div style="display:flex;gap:4px;">
        <input id="pfAddress" type="text" placeholder="주소 입력" style="flex:1;font-size:12px;">
        <button class="small" onclick="searchAddress()">검색</button>
      </div>
      <div id="addressResults" style="margin-top:4px;max-height:120px;overflow-y:auto;"></div>
      <label>좌표</label>
      <div style="display:flex;gap:4px;">
        <input id="pfLat" type="number" step="any" placeholder="위도" style="font-size:12px;">
        <input id="pfLng" type="number" step="any" placeholder="경도" style="font-size:12px;">
      </div>
      <div class="map-wrap" style="margin-top:6px;">
        <div id="pinMap" class="map" style="height:250px;"></div>
      </div>
      <p class="muted" style="font-size:11px;">클릭 = 위치 지정 · 마커 드래그 = 이동 (확인창)</p>
      <div style="margin-top:8px;display:flex;gap:4px;">
        <button class="success small" onclick="savePin()">저장</button>
        <button class="gray small" onclick="hidePinForm()">취소</button>
      </div>
    </div>
  </div>

  <!-- 설정 탭 -->
  <div class="tab-panel" id="tab-settings">
    <div class="card compact-card">
      <h2>GPS 설정</h2>
      <label>전송 간격 (초)</label>
      <input id="setInterval" type="number" min="5" max="300" value="15" style="font-size:12px;">
      <label>비활성 판정 (분)</label>
      <input id="setStale" type="number" min="1" max="60" value="10" style="font-size:12px;">
      <div style="margin-top:8px;">
        <button class="success small" onclick="saveSettings()">저장</button>
      </div>
    </div>
    <div class="card compact-card">
      <h2>Firebase</h2>
      <div id="fbStatus" class="muted" style="font-size:11px;">확인 중...</div>
    </div>
  </div>
</div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f3f8fa6decb5e2185b09d6bf70ef525b&libraries=services&autoload=false"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
var pinMap = null, pinMapMarker = null, geocoder = null;

initFirebaseSync();
onDataReady(function() {
  var saved = localStorage.getItem('kids_admin_login');
  if (saved) {
    try {
      var cred = JSON.parse(saved);
      var cfg = getConfig();
      if (cfg.adminEmail === cred.email && cfg.adminPw === cred.pw) {
        enterAdmin();
        return;
      }
    } catch(e) {}
    localStorage.removeItem('kids_admin_login');
  }
  document.getElementById('adminEmail').focus();
});

function adminLogin() {
  var email = document.getElementById('adminEmail').value.trim();
  var pw = document.getElementById('adminPw').value;
  if (!email || !pw) { document.getElementById('adminErr').textContent = '이메일과 비밀번호를 입력하세요.'; return; }

  var cfg = getConfig();
  if (!cfg.adminEmail) {
    fbDb.ref('/config/adminEmail').set(email);
    fbDb.ref('/config/adminPw').set(pw);
    fbDb.ref('/config/adminId').set(email);
    localStorage.setItem('kids_admin_login', JSON.stringify({email:email, pw:pw}));
    enterAdmin();
    return;
  }

  if (email === cfg.adminEmail && pw === cfg.adminPw) {
    localStorage.setItem('kids_admin_login', JSON.stringify({email:email, pw:pw}));
    enterAdmin();
  } else {
    document.getElementById('adminErr').textContent = '이메일 또는 비밀번호가 틀립니다.';
    document.getElementById('adminPw').value = '';
  }
}

function enterAdmin() {
  document.getElementById('adminLoginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = '';
  render();
  loadSettings();
  document.getElementById('fbStatus').innerHTML = '<span style="color:#27ae60;">✅ 연결됨</span>';
}

window.onDataChanged = function() {
  if (document.getElementById('adminPanel').style.display !== 'none') render();
};

var TAB_LABELS = { parents: '부모', children: '자녀', pins: '거점', settings: '설정' };
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent.includes(TAB_LABELS[name] || ''));
  });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
}

function render() {
  renderParentsList();
  renderChildrenList();
  renderPins();
  renderParentChildren();
}

// ──── 부모 ────
function renderParentsList() {
  var parents = getParents();
  var list = document.getElementById('parentsList');
  if (!parents.length) { list.innerHTML = ''; document.getElementById('parentsEmpty').style.display = ''; return; }
  document.getElementById('parentsEmpty').style.display = 'none';
  var children = getChildren();
  var html = '';
  parents.forEach(function(p) {
    var cn = (p.childIds || []).map(function(cid) {
      var c = children.find(function(x) { return x.id === cid; });
      return c ? (c.emoji||'') + c.name : '';
    }).filter(Boolean).join(', ') || '자녀없음';
    html += '<div class="compact-item">'
      + '<span>👤</span>'
      + '<div style="flex:1;min-width:0;">'
      + '<div class="name">' + p.name + ' <span class="sub">(' + (p.loginId||'') + ')</span></div>'
      + (p.phone ? '<div class="sub"><a href="tel:' + p.phone + '" style="color:#3498db;">📞 ' + p.phone + '</a></div>' : '')
      + '<div class="sub">' + cn + '</div></div>'
      + '<button class="small" onclick="editParent(\'' + p.id + '\')">수정</button>'
      + '<button class="small danger" onclick="deleteParent(\'' + p.id + '\',\'' + p.name + '\')">삭제</button>'
      + '</div>';
  });
  list.innerHTML = html;
}

function renderParentChildren() {
  var parents = getParents(); var children = getChildren();
  if (!parents.length || !children.length) { document.getElementById('parentChildrenCard').style.display='none'; return; }
  document.getElementById('parentChildrenCard').style.display = '';
  var html = '';
  parents.forEach(function(p) {
    var assigned = p.childIds || [];
    html += '<div style="margin-bottom:10px;padding:8px;background:#f8f9fa;border-radius:6px;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
      + '<b>👤 ' + p.name + '</b>'
      + '<button class="small success" onclick="showAssignChild(\'' + p.id + '\')">+ 배정</button>'
      + '</div>';
    if (!assigned.length) {
      html += '<div class="sub" style="padding:4px 0;">자녀 없음</div>';
    }
    assigned.forEach(function(cid) {
      var c = children.find(function(x){return x.id===cid;});
      if(c) html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;">'
        + '<span>' + (c.emoji||'📍') + '</span>'
        + '<span style="flex:1;">' + c.name + ' <span class="sub" style="color:#3498db;font-weight:600;">[' + (c.code||'?') + ']</span></span>'
        + '<button class="small danger" onclick="unassignChild(\'' + p.id + '\',\'' + cid + '\',\'' + c.name + '\')" style="font-size:10px;">해제</button>'
        + '</div>';
    });
    html += '</div>';
  });
  document.getElementById('parentChildrenList').innerHTML = html;
}

function showAssignChild(parentId) {
  var parent = getParents().find(function(p){return p.id===parentId;});
  if (!parent) return;
  var assigned = parent.childIds || [];
  var children = getChildren().filter(function(c) { return assigned.indexOf(c.id) === -1; });
  if (!children.length) { alert('배정할 수 있는 자녀가 없습니다.\n(이미 모두 배정됨)'); return; }
  var list = children.map(function(c, i) { return (i+1) + '. ' + (c.emoji||'') + ' ' + c.name; }).join('\n');
  var pick = prompt(parent.name + '에게 배정할 자녀 번호:\n\n' + list + '\n\n(쉼표로 여러 명 가능: 1,2,3)');
  if (!pick) return;
  var nums = pick.split(/[,\s]+/).map(function(n){return parseInt(n)-1;}).filter(function(n){return n>=0 && n<children.length;});
  if (!nums.length) return;
  var ids = assigned.slice();
  nums.forEach(function(n) {
    if (ids.indexOf(children[n].id) === -1) ids.push(children[n].id);
  });
  fbDb.ref('/parents/' + parentId + '/childIds').set(ids);
  var names = nums.map(function(n){return children[n].name;}).join(', ');
  alert(names + ' 배정 완료!');
}

function unassignChild(parentId, childId, childName) {
  if (!confirm(childName + ' 배정 해제?')) return;
  var parent = getParents().find(function(p){return p.id===parentId;});
  if (!parent) return;
  var ids = (parent.childIds||[]).filter(function(id){return id!==childId;});
  fbDb.ref('/parents/' + parentId + '/childIds').set(ids);
}

// ──── 자녀 ────
function renderChildrenList() {
  var children = getChildren();
  var list = document.getElementById('childrenList');
  if (!children.length) { list.innerHTML = ''; document.getElementById('childrenEmpty').style.display = ''; return; }
  document.getElementById('childrenEmpty').style.display = 'none';
  var html = '';
  children.forEach(function(c) {
    html += '<div class="compact-item">'
      + '<span style="font-size:18px;">' + (c.emoji||'📍') + '</span>'
      + '<div style="flex:1;min-width:0;">'
      + '<div class="name">' + c.name + '</div>'
      + '<div class="sub">코드: <b style="color:#2c3e50;font-size:13px;letter-spacing:2px;">' + (c.code||'없음') + '</b>'
      + (c.phone ? ' · <a href="tel:' + c.phone + '" style="color:#3498db;">📞' + c.phone + '</a>' : '') + '</div></div>'
      + '<button class="small" onclick="editChild(\'' + c.id + '\')">수정</button>'
      + '<button class="small" onclick="regenCode(\'' + c.id + '\')">코드갱신</button>'
      + '<button class="small danger" onclick="deleteChild(\'' + c.id + '\',\'' + c.name + '\')">삭제</button>'
      + '</div>';
  });
  list.innerHTML = html;
}

function showAddChild() {
  var idx = getChildren().length;
  document.getElementById('childFormTitle').textContent = '자녀 추가';
  document.getElementById('editChildId').value = '';
  document.getElementById('cfName').value = '';
  document.getElementById('cfPhone').value = '';
  document.getElementById('cfEmoji').value = CHILD_EMOJIS[idx % CHILD_EMOJIS.length];
  document.getElementById('cfColor').value = CHILD_COLORS[idx % CHILD_COLORS.length];
  buildChildPickers();
  document.getElementById('childForm').style.display = '';
}
function editChild(id) {
  var c = getChildren().find(function(x){return x.id===id;});
  if(!c) return;
  document.getElementById('childFormTitle').textContent = '자녀 수정';
  document.getElementById('editChildId').value = id;
  document.getElementById('cfName').value = c.name;
  document.getElementById('cfPhone').value = c.phone||'';
  document.getElementById('cfEmoji').value = c.emoji||'🐻';
  document.getElementById('cfColor').value = c.color||'#FF6B6B';
  buildChildPickers();
  document.getElementById('childForm').style.display = '';
}
function buildChildPickers() {
  var eh = ''; CHILD_EMOJIS.forEach(function(e) {
    eh += '<button type="button" onclick="document.getElementById(\'cfEmoji\').value=\'' + e + '\'" style="font-size:18px;background:none;border:1px solid #ddd;border-radius:4px;padding:3px 6px;cursor:pointer;">' + e + '</button>';
  });
  document.getElementById('cfEmojiPicker').innerHTML = eh;
  var ch = ''; CHILD_COLORS.forEach(function(c) {
    ch += '<button type="button" onclick="document.getElementById(\'cfColor\').value=\'' + c + '\'" style="width:24px;height:24px;border-radius:50%;background:' + c + ';border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0;"></button>';
  });
  document.getElementById('cfColorPicker').innerHTML = ch;
}
function hideChildForm() { document.getElementById('childForm').style.display = 'none'; }
function saveChild() {
  var name = document.getElementById('cfName').value.trim();
  if (!name) { alert('이름을 입력하세요.'); return; }
  var editId = document.getElementById('editChildId').value;
  var id = editId || uid();
  var old = editId ? getChildren().find(function(c){return c.id===editId;}) : null;
  var code = old ? (old.code || generateCode()) : generateCode();
  var phone = document.getElementById('cfPhone').value.trim();
  var childData = {
    name: name, emoji: document.getElementById('cfEmoji').value||'🐻',
    color: document.getElementById('cfColor').value||'#FF6B6B',
    code: code, order: old ? (old.order||0) : getChildren().length+1
  };
  if (phone) childData.phone = phone;
  fbDb.ref('/children/' + id).set(childData).then(function() {
    hideChildForm();
    if (!editId) alert('접속 코드: ' + code + '\n\n이 코드를 아이에게 알려주세요.');
  }).catch(function(e){alert('실패: '+e.message);});
}
function regenCode(id) {
  var c = getChildren().find(function(x){return x.id===id;});
  if (!c) return;
  if (!confirm(c.name + '의 코드를 새로 만들까요?\n기존 코드는 사용할 수 없게 됩니다.')) return;
  var newCode = generateCode();
  fbDb.ref('/children/' + id + '/code').set(newCode).then(function() {
    alert('새 코드: ' + newCode);
  });
}
function deleteChild(id, name) {
  if (!confirm(name + ' 삭제?\n이 자녀의 위치 데이터도 삭제됩니다.')) return;
  fbDb.ref('/children/' + id).remove();
  fbDb.ref('/locations/' + id).remove();
  fbDb.ref('/childPins').once('value', function(snap) {
    var pins = snap.val() || {};
    Object.keys(pins).forEach(function(k) {
      if (pins[k].childId === id) fbDb.ref('/childPins/' + k).remove();
    });
  });
  var parents = getParents();
  parents.forEach(function(p) {
    if ((p.childIds||[]).indexOf(id) !== -1) {
      var ids = p.childIds.filter(function(x){return x!==id;});
      fbDb.ref('/parents/' + p.id + '/childIds').set(ids);
    }
  });
}

function showAddParent() {
  document.getElementById('parentFormTitle').textContent = '부모 추가';
  document.getElementById('editParentId').value = '';
  document.getElementById('ppName').value = '';
  document.getElementById('ppLoginId').value = '';
  document.getElementById('ppLoginPw').value = '';
  document.getElementById('ppPhone').value = '';
  document.getElementById('parentForm').style.display = '';
}
function editParent(id) {
  var p = getParents().find(function(x){return x.id===id;});
  if(!p) return;
  document.getElementById('parentFormTitle').textContent = '부모 수정';
  document.getElementById('editParentId').value = id;
  document.getElementById('ppName').value = p.name;
  document.getElementById('ppLoginId').value = p.loginId || '';
  document.getElementById('ppLoginPw').value = p.loginPw || '';
  document.getElementById('ppPhone').value = p.phone || '';
  document.getElementById('parentForm').style.display = '';
}
function hideParentForm() { document.getElementById('parentForm').style.display = 'none'; }
function saveParent() {
  var name = document.getElementById('ppName').value.trim();
  var loginId = document.getElementById('ppLoginId').value.trim();
  var loginPw = document.getElementById('ppLoginPw').value.trim();
  if (!name||!loginId||!loginPw) { alert('모든 항목을 입력하세요.'); return; }
  var editId = document.getElementById('editParentId').value;
  var id = editId || uid();
  var dup = getParents().find(function(p){return p.loginId===loginId && p.id!==id;});
  if(dup) { alert('이미 사용 중인 아이디입니다.'); return; }
  var old = editId ? getParents().find(function(p){return p.id===editId;}) : null;
  var phone = document.getElementById('ppPhone').value.trim();
  var data = { name: name, loginId: loginId, loginPw: loginPw, childIds: old ? (old.childIds||[]) : [] };
  if (phone) data.phone = phone;
  if (old && old.settings) data.settings = old.settings;
  fbDb.ref('/parents/' + id).set(data).then(hideParentForm).catch(function(e){alert('실패: '+e.message);});
}
function deleteParent(id, name) {
  if(!confirm(name + ' 삭제?')) return;
  fbDb.ref('/parents/' + id).remove();
}

// ──── 거점 ────
function renderPins() {
  var pins = getPins(); var list = document.getElementById('pinsList');
  if(!pins.length) { list.innerHTML=''; document.getElementById('pinsEmpty').style.display=''; return; }
  document.getElementById('pinsEmpty').style.display = 'none';
  var html = '';
  pins.forEach(function(p) {
    var cat = PIN_CATEGORIES.find(function(c){return c.value===p.category;}) || PIN_CATEGORIES[4];
    html += '<div class="compact-item">'
      + '<span style="font-size:18px;">' + (p.emoji||cat.emoji) + '</span>'
      + '<div style="flex:1;min-width:0;">'
      + '<div class="name">' + p.name + '</div>'
      + '<div class="sub">' + cat.label + ' · ' + (p.lat?p.lat.toFixed(4)+','+p.lng.toFixed(4):'') + '</div></div>'
      + '<button class="small" onclick="editPin(\'' + p.id + '\')">수정</button>'
      + '<button class="small danger" onclick="deletePin(\'' + p.id + '\',\'' + p.name + '\')">삭제</button>'
      + '</div>';
  });
  list.innerHTML = html;
}

function showAddPin() {
  document.getElementById('pinFormTitle').textContent = '거점 추가';
  document.getElementById('editPinId').value = '';
  document.getElementById('pfName').value = '';
  document.getElementById('pfCategory').value = 'home';
  document.getElementById('pfEmoji').value = '🏠';
  document.getElementById('pfColor').value = '#e74c3c';
  document.getElementById('pfLat').value = '';
  document.getElementById('pfLng').value = '';
  document.getElementById('pfAddress').value = '';
  document.getElementById('addressResults').innerHTML = '';
  document.getElementById('pinForm').style.display = '';
  initPinMap();
}
function editPin(id) {
  var p = getPins().find(function(x){return x.id===id;});
  if(!p) return;
  document.getElementById('pinFormTitle').textContent = '거점 수정';
  document.getElementById('editPinId').value = id;
  document.getElementById('pfName').value = p.name;
  document.getElementById('pfCategory').value = p.category||'other';
  document.getElementById('pfEmoji').value = p.emoji||'📍';
  document.getElementById('pfColor').value = p.color||'#7f8c8d';
  document.getElementById('pfLat').value = p.lat||'';
  document.getElementById('pfLng').value = p.lng||'';
  document.getElementById('pfAddress').value = '';
  document.getElementById('addressResults').innerHTML = '';
  document.getElementById('pinForm').style.display = '';
  initPinMap(p.lat, p.lng);
}

function initPinMap(lat, lng) {
  kakao.maps.load(function() {
    if(!geocoder) geocoder = new kakao.maps.services.Geocoder();
    var center = new kakao.maps.LatLng(lat||35.3475, lng||126.4180);
    if(pinMap) { pinMap.setCenter(center); pinMap.relayout(); }
    else { pinMap = new kakao.maps.Map(document.getElementById('pinMap'), { center: center, level: lat?3:5 }); }
    if(pinMapMarker) pinMapMarker.setMap(null);
    if(lat && lng) {
      pinMapMarker = new kakao.maps.Marker({ position: center, map: pinMap, draggable: true });
      addMarkerDragEvent(pinMapMarker);
    }
    kakao.maps.event.addListener(pinMap, 'click', function(e) { placeMarker(e.latLng); });
    setTimeout(function(){ pinMap.relayout(); }, 100);
  });
}
function placeMarker(latlng) {
  document.getElementById('pfLat').value = latlng.getLat().toFixed(6);
  document.getElementById('pfLng').value = latlng.getLng().toFixed(6);
  if(pinMapMarker) pinMapMarker.setMap(null);
  pinMapMarker = new kakao.maps.Marker({ position: latlng, map: pinMap, draggable: true });
  addMarkerDragEvent(pinMapMarker);
}
function addMarkerDragEvent(marker) {
  kakao.maps.event.addListener(marker, 'dragend', function() {
    var pos = marker.getPosition();
    if(confirm('이 위치로 이동할까요?')) {
      document.getElementById('pfLat').value = pos.getLat().toFixed(6);
      document.getElementById('pfLng').value = pos.getLng().toFixed(6);
    } else {
      var oLat = parseFloat(document.getElementById('pfLat').value);
      var oLng = parseFloat(document.getElementById('pfLng').value);
      if(!isNaN(oLat)&&!isNaN(oLng)) marker.setPosition(new kakao.maps.LatLng(oLat, oLng));
    }
  });
}

function searchAddress() {
  var addr = document.getElementById('pfAddress').value.trim();
  if(!addr) { alert('주소를 입력하세요.'); return; }
  kakao.maps.load(function() {
    if(!geocoder) geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(addr, function(result, status) {
      if(status === kakao.maps.services.Status.OK && result.length) {
        var html = '';
        result.forEach(function(r) {
          html += '<div style="padding:4px 6px;border-bottom:1px solid #eee;cursor:pointer;font-size:11px;" '
            + 'onclick="selectAddr('+r.y+','+r.x+',\''+r.address_name.replace(/'/g,"\\'")+'\')">'
            + '📍 ' + r.address_name + '</div>';
        });
        document.getElementById('addressResults').innerHTML = html;
      } else {
        document.getElementById('addressResults').innerHTML = '<div class="muted" style="padding:4px;font-size:11px;">결과 없음</div>';
      }
    });
  });
}
function selectAddr(lat, lng, name) {
  document.getElementById('addressResults').innerHTML = '';
  var ll = new kakao.maps.LatLng(lat, lng);
  pinMap.setCenter(ll); pinMap.setLevel(3);
  placeMarker(ll);
  if(!document.getElementById('pfName').value.trim()) document.getElementById('pfName').value = name;
}

function onCategoryChange() {
  var cat = PIN_CATEGORIES.find(function(c){return c.value===document.getElementById('pfCategory').value;}) || PIN_CATEGORIES[4];
  document.getElementById('pfEmoji').value = cat.emoji;
  document.getElementById('pfColor').value = cat.color;
}
function hidePinForm() { document.getElementById('pinForm').style.display = 'none'; }
function savePin() {
  var name = document.getElementById('pfName').value.trim();
  var lat = parseFloat(document.getElementById('pfLat').value);
  var lng = parseFloat(document.getElementById('pfLng').value);
  if(!name) { alert('이름을 입력하세요.'); return; }
  if(isNaN(lat)||isNaN(lng)) { alert('위치를 지정하세요.'); return; }
  var editId = document.getElementById('editPinId').value;
  var id = editId || uid();
  var pins = getPins();
  var order = editId ? ((pins.find(function(p){return p.id===editId;})||{}).order||pins.length) : pins.length+1;
  fbDb.ref('/pins/'+id).set({
    name: name, emoji: document.getElementById('pfEmoji').value||'📍',
    category: document.getElementById('pfCategory').value||'other',
    color: document.getElementById('pfColor').value||'#7f8c8d',
    lat: lat, lng: lng, order: order
  }).then(hidePinForm).catch(function(e){alert('실패: '+e.message);});
}
function deletePin(id, name) { if(confirm(name+' 삭제?')) fbDb.ref('/pins/'+id).remove(); }

// ──── 설정 ────
function loadSettings() {
  var cfg = getConfig();
  document.getElementById('setInterval').value = cfg.gpsIntervalSec || 15;
  document.getElementById('setStale').value = cfg.staleMinutes || 10;
}
function saveSettings() {
  var cfg = getConfig();
  var data = Object.assign({}, cfg, {
    gpsIntervalSec: parseInt(document.getElementById('setInterval').value) || 15,
    staleMinutes: parseInt(document.getElementById('setStale').value) || 10
  });
  fbDb.ref('/config').set(data).then(function(){ alert('저장됨'); }).catch(function(e){ alert('실패: '+e.message); });
}
</script>
